<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23f1e8cf' stroke='%23d2c39c' stroke-width='2'/%3E%3Cpath d='M25 9h14M28 9v15L15 46a6 6 0 0 0 5 9h24a6 6 0 0 0 5-9L36 24V9' fill='none' stroke='%234a1d87' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M19.5 41h25L49 48.5A4 4 0 0 1 45.5 54h-27A4 4 0 0 1 15 48.5z' fill='%234a1d87'/%3E%3Ccircle cx='29' cy='35' r='2.2' fill='%234a1d87'/%3E%3Ccircle cx='35' cy='30' r='1.6' fill='%234a1d87'/%3E%3C/svg%3E" />
<title>Create account · Brew Bot</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f1e8cf;
    --panel: #f7f0db;
    --panel-2: #e9dfc2;
    --border: #d2c39c;
    --text: #17130f;
    --muted: #5f5442;
    --accent: #4a1d87;      /* deep royal purple */
    --danger: #a5352b;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 500 15px/1.6 'Karla', system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center; padding: 16px;
  }
  .card {
    width: 100%; max-width: 360px;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 2px; padding: 28px 26px 24px;
  }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
  .logo { width: 22px; height: 22px; color: var(--accent); flex-shrink: 0; }
  h1 { font-family: 'Cormorant Garamond', Georgia, serif; font-size: 25px; margin: 0; font-weight: 600; letter-spacing: .3px; }
  .sub { color: var(--muted); font-size: 13px; margin: 0 0 18px 32px; }
  label { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: .6px;
          color: var(--muted); margin: 14px 0 6px; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 5px; }
  input {
    width: 100%; padding: 10px 12px; font: inherit; color: var(--text);
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 2px; outline: none;
  }
  input:focus { border-color: var(--accent); }
  button {
    width: 100%; margin-top: 22px; padding: 11px; font: inherit; font-weight: 600;
    color: #f7f0db; background: var(--accent); border: 0; border-radius: 2px; cursor: pointer;
  }
  button:hover { filter: brightness(1.08); }
  .err {
    display: none; margin-top: 16px; padding: 9px 12px; font-size: 13px;
    color: var(--danger); border: 1px solid var(--danger); border-radius: 2px;
    background: rgba(165, 53, 43, .08);
  }
  .alt { margin-top: 16px; text-align: center; font-size: 13px; color: var(--muted); }
  .alt a { color: var(--accent); text-decoration: none; }
  .alt a:hover { text-decoration: underline; }
</style>
</head>
<body>
  <form class="card" method="post" action="/signup">
    <div class="brand"><svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><path d="M25 9h14M28 9v15L15 46a6 6 0 0 0 5 9h24a6 6 0 0 0 5-9L36 24V9" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M19.5 41h25L49 48.5A4 4 0 0 1 45.5 54h-27A4 4 0 0 1 15 48.5z" fill="currentColor"/><circle cx="29" cy="35" r="2.4" fill="currentColor"/><circle cx="35" cy="30" r="1.8" fill="currentColor"/></svg><h1>Brew Bot</h1></div>
    <p class="sub">Create your account</p>
    <label for="username">Username</label>
    <input id="username" name="username" autocomplete="username" autofocus required
           pattern="[A-Za-z0-9_.\-]{3,24}" maxlength="24" />
    <div class="hint">3–24 letters, numbers, dots, dashes or underscores.</div>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="new-password" minlength="6" required />
    <label for="confirm">Confirm password</label>
    <input id="confirm" name="confirm" type="password" autocomplete="new-password" minlength="6" required />
    <label for="code">Site code</label>
    <input id="code" name="code" type="password" autocomplete="off" required />
    <div class="hint">The code you got from whoever invited you.</div>
    <button type="submit">Create account</button>
    <div class="err" id="err"></div>
    <div class="alt">Already have an account? <a href="/login">Sign in</a></div>
  </form>
<script>
  const e = new URLSearchParams(location.search).get('e');
  const msg = {
    code: "That site code isn't right.",
    taken: 'That username is taken - try another.',
    badname: 'Usernames are 3–24 letters, numbers, dots, dashes or underscores.',
    weak: 'Passwords need at least 6 characters.',
    mismatch: "The two passwords don't match.",
    locked: 'Too many failed attempts. Try again in 15 minutes.',
  }[e];
  if (msg) { const el = document.getElementById('err'); el.textContent = msg; el.style.display = 'block'; }
</script>
</body>
</html>
