function renderDeck() {
  document.body.classList.toggle('has-deck', !!deck);
  document.getElementById('canvasTitle').textContent = deck ? 'Deck' : 'Card canvas';
  if (!deck || !deck.cards) { deckView.innerHTML = ''; toolbarEl = null; return; }
  const scroll = cardsEl.scrollTop;
  const note = mentionView.querySelector('.empty-note');
  if (note) note.remove();
  const comp = deckComposition();
  // title + toolbar share one framed plate; the toolbar persists so the add-card box keeps focus
  if (!toolbarEl) {
    deckView.innerHTML = '';
    const plate = document.createElement('div'); plate.className = 'deck-plate';
    toolbarEl = buildToolbar(); plate.appendChild(toolbarEl); deckView.appendChild(plate);
  }
  syncToolbar();
  // the title sits above the (persistent) toolbar; everything below it is rebuilt on each change
  const oldTitle = deckView.querySelector('.deck-title');
  if (oldTitle) oldTitle.remove();
  toolbarEl.parentNode.insertBefore(deckTitleBlock(comp), toolbarEl);
  while (deckView.lastChild !== toolbarEl.parentNode) deckView.removeChild(deckView.lastChild);

  const head = document.createElement('div');
  head.className = 'deck-head';
  const roleStr = DECK_ROLES.filter(r => comp.roleCounts[r]).map(r => `${r} ${comp.roleCounts[r]}`).join('  ·  ');
  const cap = GC_CAP[deck.bracket];
  const stat = (n, of, label) => `<div class="ds"><span class="ds-n">${n}${of !== undefined ? `<small>/${of}</small>` : ''}</span><span class="ds-l">${label}</span></div>`;
  head.innerHTML =
    `<div class="deck-stats">${stat(comp.total, 100, 'cards')}${stat(comp.lands, undefined, 'lands')}`
    + `${stat(comp.avgMv.toFixed(2), undefined, 'avg MV')}${stat(comp.gc, cap, 'game changers')}</div>`
    + (roleStr ? `<div class="deck-roles">${roleStr}</div>` : '');
  const warns = document.createElement('ul'); warns.className = 'deck-warns';
  const warn = (text, hint) => { const w = document.createElement('li'); w.className = 'deck-warn' + (hint ? ' hint' : ''); w.textContent = text; warns.appendChild(w); };
  if (!deck.cards.length) warn(building() ? 'No commander yet - ask the advisor for ideas, or click the title to pick one'
                                          : 'Empty deck - add cards with the search box, or paste a list in chat', true);
  else {
    if (!(deck.commander || []).length) warn('No commander yet - click the title to choose one', true);
    for (const n of deck.commander || []) {
      const c = deckFind(n);
      if (c && !canCommand(c)) warn(`${c.name} can't normally be a commander`);
    }
    // a commander can lift the maximum (Whtz, the Bibliophile: "no maximum deck size")
    const noMax = deck.cards.some(c => isCommander(c) && c.no_max_deck);
    if ((comp.total < 100 || (comp.total > 100 && !noMax)) && !building())
      warn(comp.total < 100 ? `${100 - comp.total} short of 100` : `${comp.total - 100} over 100`);
    if (cap !== undefined && comp.gc > cap) warn(`${comp.gc - cap} game changer${comp.gc - cap > 1 ? 's' : ''} over the B${deck.bracket} cap`);
    if (comp.offColor.length) warn(`Off-color: ${comp.offColor.join(', ')}`);
    if (comp.dupes.length) warn(`Not singleton: ${comp.dupes.join(', ')}`);
    if (deck.not_found && deck.not_found.length) warn(`Unresolved from paste: ${deck.not_found.join(', ')}`);
  }
  if (warns.childNodes.length) head.appendChild(warns);
  deckView.appendChild(head);
  if (building()) deckView.appendChild(buildPanel(comp));
  if (deck.cards.length) deckView.append(statsPanel(), advancedPanel(comp), oddsPanel(comp), goldfishPanel(comp));
  refreshCompanion();

  // group -> cards, in taxonomy order (plus any custom role names at the end)
  const byGroup = {};
  for (const c of deck.cards) (byGroup[cardGroup(c)] = byGroup[cardGroup(c)] || []).push(c);
  const order = DECK_ROLES.concat(Object.keys(byGroup).filter(g => !DECK_ROLES.includes(g)));
  const ident = commanderIdentity();
  deckTiles = new Map();
  for (const g of order) {
    const cards = (byGroup[g] || []).sort((a, b) => (a.cmc || 0) - (b.cmc || 0) || a.name.localeCompare(b.name));
    const section = document.createElement('div');
    section.className = 'role-group' + (cards.length ? '' : ' empty-group');
    section.dataset.group = g;
    const title = document.createElement('div'); title.className = 'role-group-title';
    title.textContent = `${g} · ${cards.reduce((s, c) => s + (c.qty || 1), 0)}`;
    const grid = document.createElement('div'); grid.className = 'role-grid';
    for (const c of cards) grid.appendChild(deckCardTile(c, ident));
    section.appendChild(title); section.appendChild(grid);
    bindDropZone(section);
    deckView.appendChild(section);
    if (g === 'Commander' && deck.companion) deckView.appendChild(companionSection());
  }
  if (!deck.maybe) deck.maybe = [];
  deckView.appendChild(maybeSection());
  cardsEl.scrollTop = scroll;
}

function deckCardTile(c, ident) {
  const tile = document.createElement('div');
  tile.className = 'card-tile' + (c.game_changer ? ' gc' : '') + (isCommander(c) ? ' commander' : '');
  if (offColorFor(c, ident)) tile.classList.add('offcolor');
  tile.title = c.name + (c.qty > 1 ? ` (x${c.qty})` : '') + ' - click to edit, drag to change role';
  if (c.image) {
    const img = document.createElement('img'); img.loading = 'lazy'; img.src = c.image; img.alt = c.name; img.draggable = false;
    tile.appendChild(img);
  } else { tile.classList.add('missing'); tile.textContent = c.name; }
  if (c.qty > 1) { const q = document.createElement('span'); q.className = 'qty'; q.textContent = c.qty; tile.appendChild(q); }
  if (c.tags && c.tags.length) { const t = document.createElement('span'); t.className = 'tag-dot'; t.textContent = '#' + c.tags.join(' #'); tile.appendChild(t); }
  const acts = document.createElement('div'); acts.className = 'tile-actions';
  acts.innerHTML = '<button data-a="dec" title="One fewer">−</button><button data-a="inc" title="One more">+</button><button data-a="rm" class="rm" title="Remove">×</button>';
  acts.addEventListener('click', (e) => {
    e.stopPropagation();
    const a = e.target.dataset.a;
    if (a === 'inc') changeQty(c.name, +1);
    else if (a === 'dec') changeQty(c.name, -1);
    else if (a === 'rm') removeCard(c.name);
  });
  tile.appendChild(acts);
  tile.style.cursor = 'pointer';
  tile.addEventListener('click', () => openEditor(c.name));
  tile.draggable = true;
  tile.addEventListener('dragstart', (e) => { tile.classList.add('dragging-src'); setDragCard(e, c.name, 'deck'); });
  tile.addEventListener('dragend', () => { tile.classList.remove('dragging-src'); endDrag(); });
  deckTiles.set(lc(c.name), tile);
  return tile;
}
function bindDropZone(section) {
  section.addEventListener('dragover', (e) => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; section.classList.add('drop-over'); });
  section.addEventListener('dragleave', (e) => { if (!section.contains(e.relatedTarget)) section.classList.remove('drop-over'); });
  section.addEventListener('drop', (e) => {
    e.preventDefault(); section.classList.remove('drop-over'); endDrag();
    const d = getDragCard(e);
    if (d) dropOnDeckGroup(d, section.dataset.group);
  });
}

// ---- mutations ----
// -> the deck card (new or already there), or null when it couldn't be found
async function addCardByName(name) {
  if (!deck) { deck = { commander: [], bracket: null, cards: [], not_found: [] }; }
  const existing = deckFind(name);
  if (existing) {
    if (anyQty(existing)) changeQty(existing.name, +1);
    else { showToast(`${existing.name} is already in the deck`); flashCard(existing.name); }
    return existing;
  }
  try {
    const r = await fetch('/deck/card?name=' + encodeURIComponent(name));
    if (!r.ok) { showToast(`Couldn't find "${name}"`); return null; }
    const c = await r.json();
    const again = deckFind(c.name);  // the canonical name may already be there
    if (again) { if (anyQty(again)) changeQty(again.name, +1); else { showToast(`${again.name} is already in the deck`); flashCard(again.name); } return again; }
    pushUndo();
    deck.cards.push(c);
    deckChanged();
    showToast(`Added ${c.name}`, true);
    flashCard(c.name);
    return c;
  } catch (e) { showToast(`Couldn't add "${name}"`); return null; }
}
function changeQty(name, delta) {
  const c = deckFind(name); if (!c) return;
  if ((c.qty || 1) + delta < 1) { removeCard(name); return; }
  pushUndo();
  c.qty = (c.qty || 1) + delta;
  deckChanged();
  if (editorName) renderEditor(c);
}
function removeCard(name) {
  const c = deckFind(name); if (!c) return;
  pushUndo();
  deck.cards = deck.cards.filter(x => x !== c);
  deck.commander = (deck.commander || []).filter(n => lc(n) !== lc(c.name));
  deckChanged();
  if (editorName && lc(editorName) === lc(c.name)) closeEditor();
  showToast(`Removed ${c.name}`, true);
}
function toggleCommander(name) {
  const c = deckFind(name); if (!c) return;
  pushUndo();
  const cur = deck.commander || [];
  if (isCommander(c)) deck.commander = cur.filter(n => lc(n) !== lc(c.name));
  else deck.commander = cur.length >= 2 ? [c.name] : cur.concat(c.name);  // max 2 (partners)
  deckChanged();
  if (editorName) renderEditor(c);
}
function setCardGroup(name, group) {
  const c = deckFind(name); if (!c || cardGroup(c) === group) return;
  pushUndo();
  if (isCommander(c)) deck.commander = deck.commander.filter(n => lc(n) !== lc(c.name));
  if (group === 'Commander') deck.commander = (deck.commander || []).length >= 2 ? [c.name] : (deck.commander || []).concat(c.name);
  else c.role = (group === autoGroup(c)) ? null : group;  // dropping back on its natural group clears the override
  deckChanged();
}
function setCardRole(name, role) {
  const c = deckFind(name); if (!c) return;
  pushUndo();
  c.role = role || null;
  deckChanged();
  if (editorName) renderEditor(c);
}
function setCardTags(name, text) {
  const c = deckFind(name); if (!c) return;
  const tags = [...new Set(text.split(',').map(t => t.trim().replace(/^#/, '')).filter(Boolean))];
  if (JSON.stringify(tags) === JSON.stringify(c.tags || [])) return;
  pushUndo();
  c.tags = tags;
  deckChanged();
}
// Export formats. 'plain' imports almost anywhere (commander first, no header lines);
// 'archidekt' tags the commander so Archidekt sets it on import; 'arena' uses the
// Commander/Deck section headers MTG Arena-style importers expect. Both carry chosen
// printings as "(SET) 123"; the plain list stays bare so it imports anywhere.
const EXPORT_FORMATS = {
  plain: 'Plain list (most sites)',
  archidekt: 'Archidekt (commander tagged, printings)',
  arena: 'MTG Arena / Moxfield style (printings)',
};
function decklistText(format) {
  const cmdrs = deck.cards.filter(isCommander);
  const rest = deck.cards.filter(c => !isCommander(c)).sort((a, b) => a.name.localeCompare(b.name));
  const pr = c => c.printing ? ` (${c.printing.set.toUpperCase()}) ${c.printing.cn}` : '';
  const line = c => `${c.qty || 1} ${c.name}${pr(c)}`;
  const comp = deck.companion;
  if (format === 'plain')
    return cmdrs.concat(rest).map(c => `${c.qty || 1} ${c.name}`).join('\n') + (comp ? `\n\nCompanion\n1 ${comp.name}` : '');
  if (format === 'archidekt')
    return cmdrs.map(c => `${c.qty || 1}x ${c.name}${pr(c)} [Commander{top}]`).concat(rest.map(c => `${c.qty || 1}x ${c.name}${pr(c)}`))
      .concat(comp ? [`1x ${comp.name} [Companion]`] : []).join('\n');
  if (format === 'arena' && cmdrs.length)
    return (comp ? `Companion\n1 ${comp.name}\n\n` : '') + `Commander\n${cmdrs.map(line).join('\n')}\n\nDeck\n${rest.map(line).join('\n')}`;
  return cmdrs.concat(rest).map(line).join('\n') + (comp ? `\n\nCompanion\n1 ${comp.name}` : '');
}
function copyDecklist(format = 'plain') {
  if (!deck || !deck.cards.length) return;
  navigator.clipboard.writeText(decklistText(format)).then(
    () => showToast(`Decklist copied - ${EXPORT_FORMATS[format]}`
                    + (format === 'plain' && (deck.commander || []).length ? '. Commander is on the first line.' : '')),
    () => showToast("Couldn't copy - clipboard blocked"));
}
// Goldfish: Archidekt's playtester sandbox takes the whole deck in its URL (the same link
// EDHREC's average decks use) - [{c: 'c' commander | 'm' main, f: foil, q: qty, u: Scryfall id}].
// Chosen printings carry their id; the rest are looked up (default printing) by /deck/ids.
// The tab opens before the lookup so popup blockers treat it as the click's own window.
async function goldfishInArchidekt() {
  if (!deck || !deck.cards.length) return;
  const tab = window.open('', '_blank');
  try {
    const need = deck.cards.filter(c => !(c.printing && c.printing.id)).map(c => c.name);
    let ids = {};
    if (need.length) {
      const r = await fetch('/deck/ids', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                                           body: JSON.stringify({ names: need }) });
      ids = (await r.json()).ids || {};
    }
    const cards = [], missing = [];
    for (const c of deck.cards) {
      const u = (c.printing && c.printing.id) || ids[c.name];
      if (u) cards.push({ c: isCommander(c) ? 'c' : 'm', f: 0, q: c.qty || 1, u });
      else missing.push(c.name);
    }
    cards.sort((a, b) => (a.c === 'c' ? 0 : 1) - (b.c === 'c' ? 0 : 1));
    const url = 'https://archidekt.com/playtester-v2/sandbox?deck=' + encodeURIComponent(JSON.stringify(cards));
    if (tab) tab.location.href = url; else window.open(url, '_blank');
    if (missing.length) showToast(`Left out (no Scryfall match): ${missing.join(', ')}`);
    else if (deck.companion) showToast(`Companion ${deck.companion.name} isn't in the playtester - it only takes the deck`);
  } catch (e) {
    if (tab) tab.close();
    showToast("Couldn't build the playtest link - try again");
  }
}
function toggleExportMenu(btn) {
  let menu = document.getElementById('exportMenu');
  if (menu) { menu.remove(); return; }
  menu = document.createElement('div');
  menu.id = 'exportMenu'; menu.className = 'export-menu';
  for (const [key, label] of Object.entries(EXPORT_FORMATS)) {
    const b = document.createElement('button'); b.type = 'button'; b.textContent = label;
    b.onclick = () => { menu.remove(); copyDecklist(key); };
    menu.appendChild(b);
  }
  btn.parentElement.style.position = 'relative';
  menu.style.top = (btn.offsetTop + btn.offsetHeight + 4) + 'px';
  menu.style.left = btn.offsetLeft + 'px';
  btn.parentElement.appendChild(menu);
  setTimeout(() => document.addEventListener('click', function off(e) {
    if (!menu.contains(e.target)) { menu.remove(); document.removeEventListener('click', off); }
  }), 0);
}

// ---- deck brief: commander picker + intake questionnaire (workbench phase 4) ----
// Password-manager extensions treat plain text boxes in a form as contact/address fields and pop
// autofill over them; type=search plus their documented ignore hints keeps them out.
const NO_AUTOFILL = 'autocomplete="off" data-1p-ignore data-lpignore="true" data-bwignore="true" data-form-type="other" data-protonpass-ignore="true"';
// Opens automatically when a pasted/linked deck arrives (before the advisor answers) and

function closeIntake(saved) {

function afterDecision(entry, bubble, toastText) {

// Once every proposal in a turn is decided, hand the turn back to the advisor - otherwise it
// sits idle until the player thinks to type something. A short countdown leaves time to add a
// reason (typing in a "Why?" box pauses it) or to hold off.
const AUTO_CONTINUE_SECS = 4;
let autoContinueTimer = null;  // the live countdown (Undo on a decision cancels it)
function maybeAutoContinue(entry, bubble) {
  const props = entry.proposals || [];
  if (!props.length || props.some(p => p.status === 'pending') || entry.continued) return;
  // only the latest reply hands the turn back - a decision on an older batch must never
  // read to the advisor as a verdict on its newest one
  if (entry !== lastAssistantEntry() || entryPending(entry) || trayBody.querySelector('.auto-continue')) return;
  const box = trayBody;
  box.innerHTML = '';
  showTray(entry, 'All decided');
  const bar = document.createElement('div'); bar.className = 'auto-continue';
  bar.innerHTML = '<span class="ac-text"></span><button class="prop-btn ok ac-go">Continue now</button><button class="prop-btn ac-wait">Wait</button>';
  box.appendChild(bar);
  let left = AUTO_CONTINUE_SECS, timer = null;
  const label = bar.querySelector('.ac-text');
  const paint = () => {
    const typing = !!(document.activeElement && document.activeElement.classList.contains('prop-note'));
    label.textContent = typing ? 'All decided - continuing when you finish typing…' : `All decided - continuing in ${left}s…`;
    return typing;
  };
  const go = () => {
    clearInterval(timer);
    if (entry.continued || entryPending(entry)) return;  // a decision was undone meanwhile
    if (streaming) { label.textContent = 'Waiting for the current answer…'; setTimeout(go, 1500); return; }
    entry.continued = true; saveState();
    hideTray();
    const acc = props.filter(p => p.status === 'accepted').length;
    const may = props.filter(p => p.status === 'maybe').length, rej = props.length - acc - may;
    const tally = `accepted ${acc}, ${may ? `maybe ${may}, ` : ''}rejected ${rej}`;
    inputEl.value = building()
      ? `Done deciding - ${tally}. Take my decisions and reasons into account. Before proposing the next section, ask me anything you need to know about how I want it to go.`
      : `Done deciding - ${tally}. Take my decisions and reasons into account and keep going.`;
    send(true);
  };
  autoContinueTimer = timer = setInterval(() => { if (!paint() && --left <= 0) go(); else paint(); }, 1000);
  paint();
  bar.querySelector('.ac-go').onclick = go;
  bar.querySelector('.ac-wait').onclick = () => {
    clearInterval(timer); entry.continued = true; saveState();
    hideTray(); showToast("Okay - send a message whenever you're ready.");
  };
}
function questionCard(q) {
  const box = document.createElement('div'); box.className = 'q-card';
  const title = document.createElement('div'); title.className = 'q-title'; title.textContent = q.question;
  box.appendChild(title);
  const row = document.createElement('div'); row.className = 'q-options';
  // An answer can be a pick, typed words, or both ("B - but keep it under $5"): clicking an
  // option selects it (one, or several for multi), the note box adds to it, Send sends.
  // q.pick holds the selection until then, so typing in the chat box instead still carries it.
  const open = !q.answer && !q.skipped;
  if (open && !Array.isArray(q.pick)) q.pick = [];
  const chosen = open ? q.pick : String(q.answer || '').split(' · ');
  let go = null, inp = null;
  const refresh = () => { if (go) go.disabled = !(q.pick.length || inp.value.trim()); };
  for (const opt of q.options || []) {
    const b = document.createElement('button'); b.className = 'q-opt'; b.textContent = opt;
    if (chosen.includes(opt) && (open || q.answer)) b.classList.add('sel');
    if (!open) b.disabled = true;
    else b.onclick = () => {
      const i = q.pick.indexOf(opt);
      if (i >= 0) q.pick.splice(i, 1);
      else if (q.multi) q.pick.push(opt);
      else q.pick.splice(0, q.pick.length, opt);
      row.querySelectorAll('.q-opt').forEach(x => x.classList.toggle('sel', q.pick.includes(x.textContent)));
      refresh();
      inp.focus();
    };
    row.appendChild(b);
  }
  box.appendChild(row);
  if (q.skipped) {
    const own = document.createElement('div'); own.className = 'q-own'; own.textContent = '– Skipped';
    box.appendChild(own);

    const foot = document.createElement('div'); foot.className = 'q-foot q-own-row';
    inp = document.createElement('input'); inp.type = 'search'; inp.className = 'prop-note q-own-input';
    inp.placeholder = (q.options || []).length ? 'Add a note, or type your own answer… (optional)' : 'Your answer…';

    }

      const note = inp.value.trim();

      else if (note) answerQuestion(q, note, box);
    };
    go.onclick = submit;
    inp.addEventListener('input', refresh);
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); submit(); } });
    foot.append(inp, go);
    box.appendChild(foot);
    refresh();
  } else if (q.comment) {
    const own = document.createElement('div'); own.className = 'q-own';
    own.textContent = 'You added: ' + q.comment;
    box.appendChild(own);
  } else if (!(q.options || []).some(o => chosen.includes(o))) {
    const own = document.createElement('div'); own.className = 'q-own';
    own.textContent = 'You answered: ' + q.answer;
    box.appendChild(own);

}

  q.answer = answer;

// ---- tiny markdown renderer (escape-first) ----
function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function renderMarkdown(raw) {
  let t = escapeHtml(raw);
  // Strip the machine identity marker so it never shows to the player.
  t = t.replace(/%%IDENTITY:[WUBRGC]+%%\s*/gi, '');
  // headers (### )
  t = t.replace(/^#{1,3}\s+(.+)$/gm, '<h3>$1</h3>');  // #, ## and ### all become section headings
  // bold / italic / inline code
  t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  t = t.replace(/`([^`]+)`/g, '<code>$1</code>');
  // links [text](url)
  t = t.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  // bullet lists
  t = t.replace(/(?:^[-•]\s+.+(?:\n|$))+/gm, (block) => {
    const items = block.trim().split(/\n/).map(l => l.replace(/^[-•]\s+/, '')).map(li => `<li>${li}</li>`).join('');
    return `<ul>${items}</ul>`;
  });
  // numbered lists
  t = t.replace(/(?:^\d+\.\s+.+(?:\n|$))+/gm, (block) => {
    const items = block.trim().split(/\n/).map(l => l.replace(/^\d+\.\s+/, '')).map(li => `<li>${li}</li>`).join('');
    return `<ol>${items}</ol>`;
  });
  // card chips [[Name]]
  t = t.replace(/\[\[([^\]]+)\]\]/g, (_, name) => {
    const clean = name.trim();
    return `<span class="chip" data-card="${clean.replace(/"/g,'&quot;')}">${clean}</span>`;
  });
  // paragraphs / line breaks
  t = t.replace(/\n{2,}/g, '<br><br>').replace(/\n/g, '<br>');
  // headings and lists bring their own spacing - drop the blank lines around them
  t = t.replace(/(<br>)+(<h3>|<ul>|<ol>)/g, '$2').replace(/(<\/h3>|<\/ul>|<\/ol>)(<br>)+/g, '$1');
  return t;
}

function bindChips(container) {

}

// ---- Scryfall card canvas ----
function keyFor(name) { return name.toLowerCase(); }

function requestCard(name) {
  const key = keyFor(name);
  if (seenNames.has(key)) return;
  seenNames.add(key);
  if (deckFind(name)) return;  // already on the canvas as a deck card

  // drop the empty note
  const note = mentionView.querySelector('.empty-note');
  if (note) note.remove();

  const tile = document.createElement('div');
  tile.className = 'card-tile loading';
  tile.textContent = name;
  const entry = { status: 'loading', tile, group: null };
  cardCache.set(key, entry);
  setTileGroup(entry, 'Loading');  // grouped into its concrete role once /card resolves

  // throttle Scryfall calls (~100ms apart)
  // collect names for a moment and look them all up in one request (the server batches
  // them into Scryfall's collection endpoint) instead of one round trip per card
  cardBatch.set(key, { name, entry });
  if (!cardBatchTimer) cardBatchTimer = setTimeout(flushCardBatch, 120);
}

async function flushCardBatch() {
  const batch = [...cardBatch.values()];
  cardBatch = new Map(); cardBatchTimer = null;
  for (let i = 0; i < batch.length; i += 60) {
    const part = batch.slice(i, i + 60);
    let found = {};
    try {
      const r = await fetch('/cards', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                                        body: JSON.stringify({ names: part.map(p => p.name) }) });
      if (r.ok) found = (await r.json()).cards || {};
    } catch (e) {}
    for (const { name, entry } of part) applyCard(name, entry, found[name]);
  }
}

function applyCard(name, entry, data) {
  // looked up before a chat switch? that chat's canvas is gone - skip it
  if (cardCache.get(keyFor(name)) !== entry) return;
  try {
    if (!data) throw new Error('not found');
    const img = (data.image_uris && data.image_uris.normal) ||
                (data.card_faces && data.card_faces[0].image_uris && data.card_faces[0].image_uris.normal);
    if (!img) throw new Error('no image');
    entry.canonical = data.name;
    entry.img = img;
    entry.scryfall = data.scryfall_uri;
    entry.imgBack = backImage(data);
    entry.typeLine = data.type_line || ''; entry.cmc = data.cmc || 0;  // for rulebreaker exceptions
    entry.identity = data.color_identity || [];
    entry.status = 'ok';
    entry.tile.className = 'card-tile';
    entry.tile.title = data.name;
    entry.tile.innerHTML = `<img loading="lazy" src="${img}" alt="${data.name}" draggable="false">`;
    // drag it onto a deck group (adds it there) or the Maybe board
    entry.tile.draggable = true;
    entry.tile.ondragstart = (e) => { entry.tile.classList.add('dragging-src'); setDragCard(e, data.name, 'mention'); };
    entry.tile.ondragend = () => { entry.tile.classList.remove('dragging-src'); endDrag(); };
    // Click opens an in-app lightbox (NOT a navigation) so the chat is never lost.
    entry.tile.style.cursor = 'zoom-in';
    entry.tile.onclick = () => openLightbox(entry);
    // map canonical name too, so chips/hover using the exact name resolve correctly
    cardCache.set(keyFor(data.name), entry);
    // Group the tile by its concrete role (from the otag index); no concrete role
    // means it's a contextual card (Payoff/Enabler/etc.) -> the "Other" bucket.
    entry.roles = data.roles || [];
    // quick-add button (shown only while there's a deck)
    const add = document.createElement('button');
    add.className = 'tile-add'; add.textContent = '+ Add'; add.title = 'Add to deck';
    add.addEventListener('click', (e) => { e.stopPropagation(); addCardByName(data.name); });
    const maybe = document.createElement('button');
    maybe.className = 'tile-add tile-maybe'; maybe.textContent = '+ Maybe'; maybe.title = 'Save to your Maybe board';
    maybe.addEventListener('click', (e) => { e.stopPropagation(); addMaybeCard(mentionCard(data.name)); });
    entry.tile.append(add, maybe);
    if (deckFind(data.name)) dropMentionTile(entry);  // resolved to a card the deck already has
    else setTileGroup(entry, mentionRole(entry));
    evaluateTile(entry);  // flag if outside the commander's color identity
  } catch (e) {
    entry.status = 'missing';
    entry.tile.className = 'card-tile missing';
    entry.tile.textContent = name + ' (not found)';
    setTileGroup(entry, 'Unresolved');
  }
}

function flashCard(name) {
  const entry = cardCache.get(keyFor(name));
  const dc = deckFind((entry && entry.canonical) || name);
  const tile = dc ? deckTiles.get(lc(dc.name)) : (entry && entry.tile);
  if (!tile || !tile.isConnected) return;
  tile.scrollIntoView({ behavior: 'smooth', block: 'center' });
  tile.classList.add('flash');

// ---- send / stream ----
let streaming = false;
// Interjecting: while an answer streams, the send button is a Stop button and the box stays
// live - Enter (or Stop, or Escape) cuts the answer off where it is. The partial answer is kept,
// marked interrupted (the advisor is told it was cut off), and a typed message goes out next.
let streamAbort = null, streamDone = Promise.resolve(), streamChat = null;
const SEND_HINT_BUSY = 'Type to jump in - Enter stops this answer and sends yours (Esc just stops)';
function stopAnswer() { if (streamAbort && streamChat === activeId) streamAbort.abort(); }
function setStreamingUI(on) {
  streaming = on;
  sendBtn.textContent = on ? 'Stop' : 'Send';
  sendBtn.classList.toggle('stop', on);
  sendBtn.title = on ? 'Stop the answer (Esc)' : '';
  if (on) inputEl.placeholder = SEND_HINT_BUSY;
  else if (inputEl.placeholder === SEND_HINT_BUSY) inputEl.placeholder = INPUT_HINT;
}
// The decision panel (answer buttons, suggestion cards, start-deck card) sits BELOW the reply.
// The advisor is told so; this catches the slips ("tap one above") in replies that put one up.
const POINT_ABOVE = [
  /\b((?:tap|pick|choose|click|select|hit|press|answer|decide|use|grab|check|see)\b[^.!?\n]{0,40}?)\babove\b/gi,
  /\b((?:options?|buttons?|cards?|choices|questions?|proposals?|suggestions?|swaps?|panel)\s+(?:are\s+|is\s+)?(?:right\s+|just\s+)?)above\b/gi,
  /\b(up )?there\s*↑/g];
function pointBelow(text, hasPanel) {
  if (!hasPanel || !text) return text;
  return text.replace(POINT_ABOVE[0], '$1below').replace(POINT_ABOVE[1], '$1below').replace(POINT_ABOVE[2], 'below ↓');
}
const hasPanel = m => !!(m && ((m.proposals || []).length || m.question || m.startDeck));
function markInterrupted(bubble, empty) {
  const msg = bubble && bubble.closest('.msg');
  if (!msg || msg.querySelector('.interrupted-note')) return;
  const n = document.createElement('div'); n.className = 'interrupted-note';
  n.textContent = empty ? '⏹ Stopped before answering' : '⏹ Stopped here';
  msg.appendChild(n);
  if (msg === [...messagesEl.querySelectorAll('.msg')].pop() && canRewind()) {
    const back = document.createElement('button'); back.className = 'prop-btn rewind-btn'; back.textContent = '↶ Go back a step';
    back.title = 'Drop this answer and your last message, and reopen the previous questions and suggestions';
    back.onclick = rewindStopped;
    const wrap = document.createElement('span'); wrap.className = 'rewind'; wrap.append(' · ', back);
    n.append(wrap);
  }
}

// "I want to build a ... deck" with no deck loaded -> offer the guided build first (once per chat).
const BUILD_INTENT = /\bfrom scratch\b|\b(build|building|brew|brewing|make|making|start|starting|put together|create|creating)\b[^.?!\n]{0,60}\b(deck|commander|edh|list)\b|\bnew (deck|build|commander deck)\b|\b(build|brew)(ing)?\s+(something\s+|a\s+deck\s+)?(around|with)\b/i;
function offerBuild(text) {
  chats[activeId].buildOffered = true; saveState();
  const card = document.createElement('div'); card.className = 'q-card build-offer';
  card.innerHTML = `<div class="q-title">Building a new deck?</div>
    <div class="prop-reason">Build it step by step: pick the commander and goals, and the advisor fills the deck in
      the panel one section at a time while you accept or reject each card.</div>
    <div class="q-quote"></div><div class="q-options"></div>`;
  card.querySelector('.q-quote').textContent = '“' + (text.length > 160 ? text.slice(0, 157) + '…' : text) + '”';
  const go = document.createElement('button'); go.className = 'prop-btn ok'; go.textContent = 'Build from scratch';
  go.onclick = () => { card.remove(); startBuild({ ask: text }); };
  const chat = document.createElement('button'); chat.className = 'prop-btn'; chat.textContent = 'Just chat';
  chat.onclick = () => { card.remove(); inputEl.value = text; send(true); };
  card.querySelector('.q-options').append(go, chat);
  messagesEl.appendChild(card);
  scrollToBottom();
}

async function send(force) {
  const text = inputEl.value.trim();
  if (streaming) {
    // the app's own follow-ups (auto-continue, build steps) never cut an answer off
    if (force === true || !text) return;
    if (streamChat !== activeId) { showToast('Another chat is still answering - wait a moment, or stop it there'); return; }
    inputEl.value = ''; inputEl.style.height = 'auto';
    stopAnswer();
    await streamDone;
    inputEl.value = text;
    return send();
  }
  if (!text || !activeId) return;
  if (force !== true && !deck && chats[activeId] && !chats[activeId].buildOffered
      && !looksLikeDeck(text) && BUILD_INTENT.test(text)) {
    inputEl.value = ''; inputEl.style.height = 'auto';
    offerBuild(text);
    return;
  }
  inputEl.value = ''; inputEl.style.height = 'auto';
  // Bind this stream to the chat that started it, so switching tabs mid-stream
  // never misfiles the answer. All persistence targets originConv; DOM updates
  // only happen while that chat is the one on screen.
  const originId = activeId;
  const originSession = SESSION_ID;
  const originConv = chats[originId].conversation;
  const onScreen = () => activeId === originId;
  // moving on: a pending question takes this message as its answer; undecided proposals
  // are marked skipped (the advisor is told), and the tray clears
  const live = activeDecisionEntry();
  if (live) {
    skipPending(live, force === true ? null : text);
    hideTray();
    const lb = [...messagesEl.querySelectorAll('.msg.assistant .bubble')].pop();
    if (lb) renderTurnExtras(live, lb);
  }
  setStreamingUI(true);
  const abort = streamAbort = new AbortController(); streamChat = originId;
  let finishStream; streamDone = new Promise(r => { finishStream = r; });
  const userEntry = { role: 'user', text };
  if (force === true) userEntry.auto = true;  // sent by the app (a button / auto-continue), not typed
  messagesEl.querySelectorAll('.interrupted-note .rewind').forEach(x => x.remove());  // moved on - no going back
  addMessage('user', text);
  originConv.push(userEntry); saveState(originId);
  // A pasted list becomes the deck BEFORE the advisor sees this turn, so it reasons over
  // the new deck (not the previous one). A link that can't be parsed yet (URL import is
  // a TODO) sends no deck, so the advisor goes by the link instead of a stale deck.
  let sendDeck = true;
  const pasted = looksLikeDeck(text);
  if (pasted) sendDeck = await loadDeckFromText(text);
  // Deck brief before the advisor reads a newly pasted deck (or one still missing its
  // commander) - so the first review already knows who leads it and what the player wants.
  if (sendDeck && deck && deck.cards && deck.cards.length && onScreen()
      && ((pasted && !deck.intake) || (!(deck.commander || []).length && !deck.intakeSkipped))) {
    await openIntake({ fromSend: true });
  }
  const originChat = chats[originId];
  const snap = deckSnapshot();
  const note = sendDeck ? deckEditNote(originChat.deckSent, snap) : '';
  if (note) { userEntry.note = note; if (onScreen()) annotateLastUser(note); }
  if (sendDeck) originChat.deckSent = snap;
  saveState(originId);

  let bubble = null;
  const turnProposals = []; let turnQuestion = null, turnStartDeck = null;  // interactive UI the advisor put up this turn
  let acc = '';
  const activity = addActivity();  // "Thinking…" appears immediately

  try {
    const resp = await fetch('/chat', {
      method: 'POST', signal: abort.signal,
      headers: { 'Content-Type': 'application/json' },
      // Send the full transcript (this browser is the source of truth), so the
      // model keeps context even if the server restarted since the last message.
      // `originConv` already includes the just-added user turn as its last entry.
      body: JSON.stringify({ session_id: originSession, message: text, history: originConv,
                             deck: sendDeck ? deckForChat() : null, memory: originChat.memory || null,
                             ui_version: UI_VERSION }),
    });
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const frames = buffer.split('\n\n');
      buffer = frames.pop();  // keep incomplete frame
      for (const frame of frames) {
        const ev = parseFrame(frame);
        if (!ev) continue;
        if (ev.event === 'text' || ev.event === 'replace') {
          // 'text' = next streamed chunk; 'replace' = the finished answer rewritten after the
          // off-color check struck an illegal pick
          acc = ev.event === 'replace' ? ev.data.text : acc + ev.data.text;
          if (onScreen()) {
            // follow the stream only if the reader is already at the bottom
            const atBottom = messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight < 120;
            if (!bubble) { activity.stopSpinner(); bubble = addMessage('assistant', ''); }
            if (deckIdentity === null) {
              const m = acc.match(/%%IDENTITY:([WUBRGC]+)%%/i);
              if (m) setDeckIdentity(m[1].toUpperCase());
            }
            bubble.innerHTML = renderMarkdown(pointBelow(acc, turnProposals.length || turnQuestion || turnStartDeck));
            bindChips(bubble);
            if (atBottom) scrollToBottom();
          }
        } else if (ev.event === 'reset') {
          // the model narrated, then decided to look something up - roll back to the answer
          // text kept from earlier turns (e.g. analysis written before a question/proposal)
          acc = (ev.data && ev.data.keep) || '';
          if (bubble && !acc) { bubble.closest('.msg').remove(); bubble = null; }
          else if (bubble && onScreen()) { bubble.innerHTML = renderMarkdown(acc); bindChips(bubble); }
        } else if (ev.event === 'status') {
          if (onScreen()) activity.addTool(ev.data.tool, ev.data.input || '');
        } else if (ev.event === 'identity') {
          // authoritative commander identity from the backend (tool args) -
          // drives off-color canvas flagging even if the model drops the marker
          if (onScreen() && ev.data.identity) setDeckIdentity(ev.data.identity.toUpperCase());
        } else if (ev.event === 'proposals') {
          turnProposals.push(...(ev.data.items || []));
        } else if (ev.event === 'question') {
          turnQuestion = ev.data;
        } else if (ev.event === 'start_deck') {
          turnStartDeck = ev.data;
        } else if (ev.event === 'stale') {
          showStaleBanner();
        } else if (ev.event === 'memory') {
          // earlier messages were condensed server-side; keep the memory with this chat
          originChat.memory = ev.data; saveState(originId);
        } else if (ev.event === 'remembered') {
          // the advisor saved something to the player's profile (remember_about_player)
          if (ev.data && ev.data.note) showToast('Remembered: ' + ev.data.note);
        } else if (ev.event === 'warning') {
          if (onScreen()) renderWarning(ev.data.cards);
        } else if (ev.event === 'error') {
          if (onScreen()) { activity.stopSpinner(); addMessage('assistant', '⚠️ ' + ev.data.message); }
        }
      }
    }
  } catch (e) {
    if (!abort.signal.aborted && onScreen()) addMessage('assistant', '⚠️ Connection error: ' + e.message);
  } finally {
    if (onScreen()) activity.finish();
    const interrupted = abort.signal.aborted;
    // Always persist the answer to the chat that ASKED, wherever the user is now. A stopped
    // answer is kept even when empty, so the transcript shows (and the advisor knows) where it was cut.
    if (acc.trim() || turnProposals.length || turnQuestion || turnStartDeck || interrupted) {
      const entry = { role: 'assistant', text: acc };
      if (interrupted) entry.interrupted = true;
      if (turnStartDeck) entry.startDeck = turnStartDeck;
      if (turnProposals.length) entry.proposals = turnProposals;
      if (turnQuestion) entry.question = turnQuestion;
      const fixed = pointBelow(acc, hasPanel(entry));
      if (fixed !== acc) { entry.text = fixed; if (bubble && onScreen()) { bubble.innerHTML = renderMarkdown(fixed); bindChips(bubble); } }
      originConv.push(entry);
      saveState(originId);
      // If that chat is on screen but the live bubble was lost to a tab-switch
      // (or was never drawn), re-render it so the finished answer shows.
      if (onScreen()) {
        if (interrupted && !bubble) bubble = addMessage('assistant', '');
        if (!bubble || !bubble.isConnected) loadActiveIntoUI();
        else renderTurnExtras(entry, bubble);
        if (turnProposals.length && prefs.goldfishOpen) renderDeck();  // goldfish report: before/after the new suggestions
        scrollToBottom();  // the tray just took space from the chat - keep the reply in view
      }
    }
    if (streamAbort === abort) streamAbort = null;
    setStreamingUI(false);
    // marked after streaming ends, so the Go back button is offered when it applies
    if (interrupted && onScreen() && bubble && bubble.isConnected) markInterrupted(bubble, !acc.trim());
    finishStream();
    inputEl.focus();
  }
}

function parseFrame(frame) {
  const lines = frame.split('\n');
  let event = 'message', data = '';
  for (const line of lines) {
    if (line.startsWith('event:')) event = line.slice(6).trim();
    else if (line.startsWith('data:')) data += line.slice(5).trim();
  }
  if (!data) return null;
  try { return { event, data: JSON.parse(data) }; }
  catch { return null; }
}

// ---- per-browser layout/text preferences (chat:deck ratio, card size, chat font) ----
// Stored in localStorage: a convenience for this viewer only, never needed for correctness.
const PREFS_KEY = 'brewbot_prefs_v1';
const PREF_DEFAULTS = { canvasW: null, cardMin: 105, proseSerif: true };
let prefs = { ...PREF_DEFAULTS };
try { prefs = { ...PREF_DEFAULTS, ...JSON.parse(localStorage.getItem(PREFS_KEY) || '{}') }; } catch (e) {}
function savePrefs() { try { localStorage.setItem(PREFS_KEY, JSON.stringify(prefs)); } catch (e) {} }
// widest the deck panel may get: the chat column always keeps at least 420px
function maxCanvasW() {
  const mainEl = document.querySelector('main'), side = document.getElementById('sidebar');
  if (!mainEl) return Infinity;
  const sideW = side && getComputedStyle(side).position !== 'fixed' ? side.getBoundingClientRect().width : 0;
  return mainEl.getBoundingClientRect().width - sideW - 420;
}
function applyPrefs() {
  const root = document.documentElement.style;
  // a saved width can outgrow a smaller window: clamp what's shown, keep what's saved
  const maxW = maxCanvasW();
  if (prefs.canvasW) root.setProperty('--canvas-flex', `0 0 ${Math.max(300, Math.min(prefs.canvasW, maxW))}px`); else root.removeProperty('--canvas-flex');
  root.setProperty('--card-min', prefs.cardMin + 'px');
  document.body.classList.toggle('prose-serif', !!prefs.proseSerif);
}
applyPrefs();

// Drag the divider to set the chat : deck ratio; double-click to reset.
(function initSplitter() {
  const splitter = document.getElementById('splitter');
  const mainEl = document.querySelector('main');
  const clampW = w => Math.round(Math.max(300, Math.min(w, maxCanvasW())));
  splitter.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    splitter.setPointerCapture(e.pointerId);
    document.body.classList.add('resizing');
    const move = (ev) => {
      prefs.canvasW = clampW(mainEl.getBoundingClientRect().right - ev.clientX);
      applyPrefs();
    };
    const up = () => {
      document.body.classList.remove('resizing');
      splitter.removeEventListener('pointermove', move);
      splitter.removeEventListener('pointerup', up);
      savePrefs();
    };
    splitter.addEventListener('pointermove', move);
    splitter.addEventListener('pointerup', up);
  });
  splitter.addEventListener('dblclick', () => { prefs.canvasW = null; applyPrefs(); savePrefs(); });
  window.addEventListener('resize', applyPrefs);
})();

function openProfile() {
  if (document.querySelector('.pf-modal')) return;
  const el = document.createElement('div');
  el.className = 'intake pf-modal';
  el.innerHTML = `<form class="in-inner" role="dialog" aria-modal="true" aria-labelledby="pfTitle" autocomplete="off">

    <section><h3>You told it <span class="in-hint">things to always keep in mind - it weighs these most</span></h3>
      <ul class="pf-notes"></ul>

      <div class="pf-tools"><label class="pf-learn"><input type="checkbox">Learn from my chats</label>
        <button type="button" class="in-small pf-backfill" hidden></button></div></section>
    <div class="in-actions"><button type="button" class="pf-forget">Forget everything</button>
      <button type="button" class="pf-close">Close</button><button type="submit" class="primary pf-save" disabled>Save</button></div>
  </form>`;
  document.body.appendChild(el);
  const $ = s => el.querySelector(s);
  const ta = $('.pf-text'), save = $('.pf-save'), learn = $('.pf-learn input');
  let prof = null, textDirty = false, poll = null;

  const paint = () => {
    const list = $('.pf-notes');
    list.innerHTML = prof.notes.length ? '' : '<li class="pf-empty" style="background:none;border:none;padding:0">Nothing yet. Tell it in chat ("remember that I…") or add it here.</li>';
    prof.notes.forEach((n, i) => {
      const li = document.createElement('li');
      li.innerHTML = '<span></span><small></small><button type="button" title="Forget this">×</button>';
      li.querySelector('span').textContent = n.text;
      li.querySelector('small').textContent = n.at || '';
      li.querySelector('button').onclick = () => put({ notes: prof.notes.filter((_, j) => j !== i) });
      list.appendChild(li);
    });
    if (!textDirty) ta.value = prof.text || '';
    learn.checked = !!prof.learn;
    const when = prof.updatedAt ? new Date(prof.updatedAt).toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) : '';
    $('.pf-status').textContent = prof.learning ? '· learning from your chats…'
      : prof.chats_learned ? `· from ${prof.chats_learned} chat${prof.chats_learned === 1 ? '' : 's'}${when ? ', updated ' + when : ''}` : '';
    const bf = $('.pf-backfill');
    bf.hidden = !prof.learn || prof.learning || !prof.chats_pending;
    bf.textContent = `Learn from ${prof.chats_pending} past chat${prof.chats_pending === 1 ? '' : 's'}`;
    save.disabled = !textDirty;
    clearTimeout(poll);
    if (prof.learning) poll = setTimeout(load, 4000);
  };
  const take = async r => {
    if (!r.ok) { showToast("Couldn't reach your profile - try again"); return; }
    prof = await r.json(); if (el.isConnected) paint();
  };
  const pfFail = e => { console.error('profile panel:', e); showToast("Couldn't reach your profile - try again"); };
  const load = () => fetch('/me/profile').then(take).catch(pfFail);
  const put = body => fetch('/me/profile', { method: 'PUT', headers: { 'Content-Type': 'application/json' },
                                             body: JSON.stringify(body) }).then(take).catch(pfFail);
  const close = () => {
    if (textDirty && !confirm('Discard your changes to what Brew Bot learned?')) return;
    clearTimeout(poll); el.remove(); document.removeEventListener('keydown', onKey);
  };
  const onKey = e => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', onKey);

  const addNote = () => {
    const inp = $('.pf-note-input'), text = inp.value.trim();
    if (!text) return;
    inp.value = '';
    put({ notes: [...prof.notes, { text }] });
  };
  $('.pf-note-add').onclick = addNote;
  $('.pf-note-input').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); addNote(); } });
  ta.addEventListener('input', () => { textDirty = true; save.disabled = false; });
  learn.addEventListener('change', () => put({ learn: learn.checked }));
  $('.pf-backfill').onclick = () => fetch('/me/profile/learn', { method: 'POST' }).then(take).catch(pfFail);
  $('.pf-forget').onclick = () => {
    if (!confirm('Forget everything Brew Bot has learned about you and everything you told it to remember? Your chats stay; it starts fresh from your next messages.')) return;
    textDirty = false;
    fetch('/me/profile', { method: 'DELETE' }).then(take).catch(pfFail);
  };
  el.querySelector('form').addEventListener('submit', e => {
    e.preventDefault();
    textDirty = false;
    put({ text: ta.value }).then(() => showToast('Saved - Brew Bot uses it from your next message'));
  });
  $('.in-x').onclick = close; $('.pf-close').onclick = close;
  el.addEventListener('mousedown', e => { if (e.target === el) close(); });
  load();
}

const ONB_KEY = 'mtg_advisor_onboarded_v1';
let onbOnServer = false;
function markOnboarded() {

function focusComposer(hint) {

const ONB_PATHS = [
  ['tune', 'Tune a deck I have', 'Paste a decklist or an Archidekt link. It loads as an editable deck on the right and the advisor reviews it from the real card text.'],
  ['build', 'Build one from scratch', 'Pick a commander and build the deck with the advisor, a section at a time. You approve every card.'],
  ['ask', 'Just ask a question', 'A commander idea, a card choice, a combo or a rules question - anything Commander.'],
];
function openWelcome() {
  if (document.querySelector('.onb')) return;

  el.className = 'intake onb';
  el.innerHTML = `<div class="in-inner onb-inner" role="dialog" aria-modal="true" aria-labelledby="onbTitle">

    <div class="onb-paths">${ONB_PATHS.map(([k, t, d]) => `<button type="button" class="onb-path" data-path="${k}"><b>${t}</b><span>${d}</span></button>`).join('')}</div>
    <div class="onb-foot"><button type="button" class="onb-link" data-path="tour">Show me around first →</button>

// [selectors (first visible wins), title, text]; steps whose target isn't on screen are skipped
const TOUR_STEPS = [
  [['#composer'], 'Talk to the advisor',
   'Ask anything, or paste a decklist or an Archidekt link - a pasted list loads as your deck. Card names in answers are clickable.'],
  [['#canvas'], 'Your deck and cards',
   'Cards the advisor mentions show up here. Once a deck is loaded this becomes a workbench: cards grouped by role, drag to re-sort, click one to edit, and Brief tells the advisor your gameplan, budget and pet cards.'],
  [['#buildBtn', '#newDeckBtn'], 'Start a deck',
   'Build from scratch walks you through a new deck with the advisor, section by section. New deck gives you an empty list to fill by hand.'],
  [['#sidebar', '#sidebarToggle'], 'Your chats',
   'Each chat keeps its own deck. Start a new chat for each deck you work on; they are saved for next time.'],
  [['#settingsBtn'], 'Make it yours',
   'Card size and chat font live here - and so does this tour, if you want it again.'],
];
function visibleEl(sels) {
  for (const s of sels) {
    const el = document.querySelector(s);
    if (!el) continue;
    const r = el.getBoundingClientRect();
    if (r.width > 0 && r.height > 0 && getComputedStyle(el).visibility !== 'hidden') return el;
  }
  return null;
}
function startTour() {
  const steps = TOUR_STEPS.filter(s => visibleEl(s[0]));
  if (!steps.length) return;
  const block = document.createElement('div'); block.className = 'tour-block';
  const ring = document.createElement('div'); ring.className = 'tour-ring';
  const tip = document.createElement('div'); tip.className = 'tour-tip';
  tip.setAttribute('role', 'dialog'); tip.setAttribute('aria-live', 'polite');
  document.body.append(block, ring, tip);
  let i = 0;
  const place = () => {
    const el = visibleEl(steps[i][0]);
    if (!el) return;
    const r = el.getBoundingClientRect(), pad = 6, gap = 12, m = 16;
    const vw = window.innerWidth, vh = window.innerHeight;
    const box = { left: Math.max(2, r.left - pad), top: Math.max(2, r.top - pad),
                  right: Math.min(vw - 2, r.right + pad), bottom: Math.min(vh - 2, r.bottom + pad) };
    Object.assign(ring.style, { left: box.left + 'px', top: box.top + 'px',
      width: (box.right - box.left) + 'px', height: (box.bottom - box.top) + 'px' });
    const tw = tip.offsetWidth, th = tip.offsetHeight;
    const clampX = x => Math.max(m, Math.min(x, vw - tw - m));
    const clampY = y => Math.max(m, Math.min(y, vh - th - m));
    const cx = clampX((box.left + box.right) / 2 - tw / 2), cy = clampY((box.top + box.bottom) / 2 - th / 2);
    const spots = [  // below, above, left, right; a target too big for any sits the tip inside it
      [box.bottom + gap + th <= vh - m, cx, box.bottom + gap],
      [box.top - gap - th >= m, cx, box.top - gap - th],
      [box.left - gap - tw >= m, box.left - gap - tw, cy],
      [box.right + gap + tw <= vw - m, box.right + gap, cy],
    ];
    const [, x, y] = spots.find(s => s[0]) || [true, cx, clampY(box.top + m)];
    tip.style.left = x + 'px'; tip.style.top = y + 'px';
  };
  const show = () => {
    const [, title, text] = steps[i], last = i === steps.length - 1;
    tip.innerHTML = `<h4></h4><p></p><div class="tour-actions"><span class="tour-count">${i + 1} of ${steps.length}</span>
      ${last ? '' : '<button type="button" class="tour-skip">Skip</button>'}
      ${i ? '<button type="button" class="tour-back">Back</button>' : ''}
      <button type="button" class="primary tour-next">${last ? 'Done' : 'Next'}</button></div>`;
    tip.querySelector('h4').textContent = title;
    tip.querySelector('p').textContent = text;
    place();
    tip.querySelector('.tour-next').focus();
  };
  const go = (d) => { const n = i + d; if (n >= 0 && n < steps.length) { i = n; show(); } };
  const end = () => {
    block.remove(); ring.remove(); tip.remove();
    window.removeEventListener('resize', place);
    document.removeEventListener('keydown', onKey);
    focusComposer();
  };
  const onKey = (e) => {
    if (e.key === 'Escape') end();
    else if (e.key === 'ArrowRight') go(1);
    else if (e.key === 'ArrowLeft') go(-1);
  };
  tip.addEventListener('click', (e) => {
    if (e.target.closest('.tour-skip')) end();
    else if (e.target.closest('.tour-back')) go(-1);
    else if (e.target.closest('.tour-next')) { if (i < steps.length - 1) go(1); else end(); }
  });
  window.addEventListener('resize', place);
  document.addEventListener('keydown', onKey);
  show();
}

// Load chats + restore the active one: the account's chats when signed in (cached per account
// in this browser, then synced), else this browser's.
mePromise.then(me => {
  if (me && me.auth && me.user) {
    SYNC = true;
    STORE_KEY = LEGACY_STORE_KEY + ':' + me.user.toLowerCase();
  }
  let fresh = true;
  try {
    fresh = !localStorage.getItem(STORE_KEY) && (!localStorage.getItem(LEGACY_STORE_KEY)
                                                  || !!localStorage.getItem(LEGACY_STORE_KEY + ':migrated'));
  } catch (e) {}
  initChats();
  const bootId = activeId;
  syncChats().then(() => {
    // a new device starts on a blank chat until the account's chats arrive - then open the latest
    const boot = chats[bootId];
    if (!fresh || activeId !== bootId || !boot || !isBlankChat(boot) || streaming) return;
    const latest = Object.values(chats).filter(ch => ch.id !== bootId)
      .sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0))[0];
    if (latest) { delete chats[bootId]; switchChat(latest.id); }
  });
});

// First visit: the account's flag when signed in, else this browser's.
mePromise.then(me => {
  onbOnServer = !!(me && me.auth && typeof me.onboarded === 'boolean');
  let seen = onbOnServer && me.onboarded;
  if (!onbOnServer) { try { seen = !!localStorage.getItem(ONB_KEY); } catch (e) { seen = true; } }
  if (!seen && !streaming && !document.querySelector('.intake:not([hidden])')) openWelcome();
});
</script>
