<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2314161a'/%3E%3Cpath d='M25 9h14M28 9v15L15 46a6 6 0 0 0 5 9h24a6 6 0 0 0 5-9L36 24V9' fill='none' stroke='%23c9963f' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M19.5 41h25L49 48.5A4 4 0 0 1 45.5 54h-27A4 4 0 0 1 15 48.5z' fill='%23c9963f'/%3E%3Ccircle cx='29' cy='35' r='2.2' fill='%23c9963f'/%3E%3Ccircle cx='35' cy='30' r='1.6' fill='%23c9963f'/%3E%3C/svg%3E" />
<title>Brew Bot</title>
<style>
  :root {
    --bg: #14161a;
    --panel: #1c1f26;
    --panel-2: #232732;
    --border: #2e3340;
    --text: #e6e8ec;
    --muted: #9aa2b1;
    --accent: #c9963f;      /* MTG gold */
    --accent-2: #5a7fb5;
    --user: #2b3446;
    --chip: #3a2f18;
    --chip-border: #c9963f;
    --danger: #d9564f;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 15px/1.55 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    display: flex; flex-direction: column; height: 100vh;
  }
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 18px; border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 650; letter-spacing: .2px; }
  header .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); }
  header .spacer { flex: 1; }
  header button {
    background: transparent; color: var(--muted); border: 1px solid var(--border);
    border-radius: 7px; padding: 6px 12px; cursor: pointer; font-size: 13px;
  }
  header button:hover { color: var(--text); border-color: var(--accent); }

  main { flex: 1; display: flex; min-height: 0; }

  /* Chat pane */
  #chat { flex: 1.35; display: flex; flex-direction: column; min-width: 0; border-right: 1px solid var(--border); }
  #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
  .msg { max-width: 92%; }
  .msg .role { font-size: 11px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin-bottom: 5px; }
  .msg.user { align-self: flex-end; }
  .msg.user .bubble { background: var(--user); border: 1px solid var(--border); white-space: pre-wrap; }
  .bubble {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; padding: 12px 15px; white-space: normal; word-wrap: break-word;
  }
  .bubble h3 { font-size: 15px; margin: 12px 0 6px; color: var(--accent); }
  .bubble strong { color: #fff; }
  .bubble code { background: #0d0f13; padding: 1px 5px; border-radius: 4px; font-size: 13px; }
  .bubble ul, .bubble ol { margin: 6px 0; padding-left: 22px; }
  .bubble li { margin: 3px 0; }
  .bubble a { color: var(--accent-2); }

  .chip {
    display: inline; color: var(--accent); border-bottom: 1px dotted var(--chip-border);
    cursor: pointer; font-weight: 550;
  }
  .chip:hover { color: #f0c874; }
  /* Advisor proposals (accept/reject) + questions */
  .turn-extras { margin-top: 10px; display: flex; flex-direction: column; gap: 8px; max-width: 100%; }
  .prop-head { display: flex; align-items: center; gap: 8px; font-size: 11.5px; text-transform: uppercase;
    letter-spacing: .6px; color: var(--muted); font-weight: 650; }
  .prop-head span { flex: 1; }
  .prop-card { display: flex; gap: 12px; background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px; align-items: flex-start; }
  .prop-card.accepted { border-color: rgba(96,170,110,.6); }
  .prop-card.rejected { opacity: .55; }
  .prop-thumbs { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
  .prop-thumb { width: 64px; aspect-ratio: 63/88; object-fit: cover; border-radius: 5px; cursor: zoom-in; }
  .prop-thumb.out { filter: grayscale(.7) brightness(.8); }
  .prop-arrow { color: var(--muted); font-size: 14px; }
  .prop-body { flex: 1; min-width: 0; }
  .prop-title { font-size: 13.5px; }
  .prop-title s { color: #f2b8b4; }
  .prop-title b { color: #b8e0bf; }
  .prop-verb { font-size: 10.5px; text-transform: uppercase; letter-spacing: .5px; color: var(--accent);
    border: 1px solid var(--accent); border-radius: 8px; padding: 0 6px; margin-right: 4px; }
  .prop-gc { font-size: 10.5px; color: var(--accent); margin-left: 6px; }
  .prop-reason { font-size: 12.5px; color: var(--muted); margin: 4px 0 8px; }
  .prop-actions { display: flex; gap: 6px; align-items: center; }
  .prop-btn { background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 7px;
    padding: 4px 12px; font: inherit; font-size: 12.5px; cursor: pointer; }
  .prop-btn:hover { border-color: var(--accent); }
  .prop-btn.ok { background: var(--accent); color: #1a1400; border-color: var(--accent); font-weight: 650; }
  .prop-status { font-size: 12.5px; color: var(--muted); }
  .prop-actions { flex-wrap: wrap; }
  .prop-note { flex: 1 1 180px; min-width: 140px; background: var(--panel); color: var(--text);
    border: 1px solid var(--border); border-radius: 7px; padding: 4px 9px; font: inherit; font-size: 12.5px; }
  .prop-note:focus { outline: none; border-color: var(--accent); }
  .prop-card.accepted .prop-status { color: #8fcf9b; }
  .q-card { background: var(--panel-2); border: 1px solid var(--accent); border-radius: 10px; padding: 12px; }
  .q-title { font-weight: 600; margin-bottom: 8px; }
  .q-options { display: flex; flex-wrap: wrap; gap: 6px; }
  .q-opt { background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 16px;
    padding: 6px 13px; font: inherit; font-size: 13px; cursor: pointer; }
  .q-opt:hover:not(:disabled) { border-color: var(--accent); }
  .q-opt.sel { background: var(--chip); color: var(--accent); border-color: var(--accent); }
  .q-opt:disabled:not(.sel) { opacity: .45; }
  .q-foot { display: flex; gap: 6px; margin-top: 8px; }
  @media (max-width: 560px) { .prop-thumb { width: 48px; } }
  .export-menu { position: absolute; z-index: 40; background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 8px; box-shadow: 0 10px 28px rgba(0,0,0,.5); padding: 4px; display: flex; flex-direction: column; min-width: 240px; }
  .export-menu button { background: none; border: none; color: var(--text); text-align: left; padding: 7px 10px;
    border-radius: 5px; font: inherit; font-size: 13px; cursor: pointer; }
  .export-menu button:hover { background: var(--user); }
  #staleBanner { background: var(--chip); border-bottom: 1px solid var(--accent); color: var(--text);
    padding: 8px 16px; font-size: 13px; text-align: center; }
  #staleBanner button { background: var(--accent); color: #1a1400; border: none; border-radius: 6px;
    padding: 3px 10px; font-weight: 650; cursor: pointer; margin: 0 2px; }
  .edit-note { font-size: 11.5px; color: var(--muted); margin-top: 4px; text-align: right; font-style: italic; }

  .status {
    align-self: flex-start; font-size: 12.5px; color: var(--muted);
    display: flex; align-items: center; gap: 8px; padding: 2px 4px;
  }
  .status .gear { animation: spin 1.6s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .warn-banner {
    align-self: stretch; background: rgba(217,86,79,.14); border: 1px solid var(--danger);
    color: #f2b8b4; border-radius: 10px; padding: 10px 13px; font-size: 13px; line-height: 1.5;
  }
  .warn-banner strong { color: #fff; }

  /* Activity / thinking + tool trace */
  .activity {
    align-self: flex-start; max-width: 92%;
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 10px; padding: 9px 13px; font-size: 12.5px; color: var(--muted);
  }
  .activity .act-head { display: flex; align-items: center; gap: 8px; font-weight: 600; }
  .activity .gear { display: inline-block; animation: spin 1.6s linear infinite; }
  .activity.done .gear { animation: none; }
  .activity .dots::after { content: ''; animation: dots 1.4s steps(4, end) infinite; }
  @keyframes dots { 0%{content:'';} 25%{content:'.';} 50%{content:'..';} 75%{content:'...';} }
  .tool-line { display: flex; gap: 7px; margin-top: 7px; align-items: baseline; }
  .tool-line .tname { color: var(--accent); font-weight: 600; white-space: nowrap; }
  .tool-line .targs { color: var(--muted); opacity: .75; word-break: break-word; font-size: 12px; }

  /* Hover card preview */
  .card-tooltip {
    position: fixed; z-index: 60; width: 224px; border-radius: 11px; overflow: hidden;
    box-shadow: 0 12px 34px rgba(0,0,0,.65); pointer-events: none; display: none;
    background: #0d0f13; border: 1px solid var(--border);
  }
  .card-tooltip img { width: 100%; display: block; }
  .card-tooltip .tt-loading { padding: 16px; font-size: 12px; color: var(--muted); text-align: center; }

  /* Card lightbox (in-app enlarge; no navigation) */
  .lightbox { position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,.78);
    display: flex; align-items: center; justify-content: center; padding: 24px; }
  .lightbox[hidden] { display: none; }  /* author display:flex would otherwise defeat the hidden attribute */
  .lightbox .lb-inner { display: flex; flex-direction: column; align-items: center; gap: 10px; max-height: 100%; }
  .lightbox .lb-img { max-height: 80vh; max-width: 90vw; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,.6); }
  .lightbox .lb-bar { display: flex; align-items: center; gap: 16px; color: var(--text); font-size: 14px; }
  .lightbox .lb-name { font-weight: 600; }
  .lightbox .lb-link { color: var(--accent); text-decoration: none; font-size: 13px; }
  .lightbox .lb-link:hover { text-decoration: underline; }

  /* Input */
  #composer { border-top: 1px solid var(--border); padding: 12px; display: flex; gap: 10px; background: var(--panel); }
  #composer textarea {
    flex: 1; resize: none; background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px; padding: 11px 13px;
    font: inherit; max-height: 160px; min-height: 44px;
  }
  #composer textarea:focus { outline: none; border-color: var(--accent); }
  #send {
    background: var(--accent); color: #1a1400; border: none; border-radius: 10px;
    padding: 0 20px; font-weight: 650; cursor: pointer;
  }
  #send:disabled { opacity: .5; cursor: default; }

  /* Canvas pane */
  #canvas { flex: 1; display: flex; flex-direction: column; min-width: 300px; background: var(--panel); }
  #canvas .canvas-head { padding: 12px 16px; border-bottom: 1px solid var(--border); font-size: 13px; color: var(--muted); display:flex; align-items:center; gap:8px;}
  #cards { flex: 1; overflow-y: auto; padding: 14px; }
  .role-group { margin-bottom: 16px; }
  .role-group-title { font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase;
    color: var(--muted); margin: 0 0 8px; padding-bottom: 5px; border-bottom: 1px solid var(--border); }
  .role-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; align-content: start; }
  .card-tile { position: relative; border-radius: 9px; overflow: hidden; background: var(--panel-2); border: 1px solid var(--border); transition: transform .12s, box-shadow .12s; aspect-ratio: 63/88; }
  .card-tile.offcolor { box-shadow: 0 0 0 2px var(--danger); }
  .card-tile.offcolor::after { content: "⚠ off-color"; position: absolute; top: 6px; left: 6px; right: 6px; text-align: center; background: rgba(217,86,79,.92); color: #fff; font-size: 11px; font-weight: 600; padding: 3px 4px; border-radius: 5px; pointer-events: none; }
  .card-tile:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0,0,0,.45); }
  .card-tile.flash { box-shadow: 0 0 0 2px var(--accent); }
  .card-tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card-tile.gc { box-shadow: 0 0 0 2px var(--accent); }
  .card-tile .qty { position: absolute; bottom: 5px; right: 5px; background: rgba(0,0,0,.82); color: #fff;
    font-size: 12px; font-weight: 700; padding: 1px 7px; border-radius: 10px; pointer-events: none; }
  .deck-head { padding: 4px 2px 12px; border-bottom: 1px solid var(--border); margin-bottom: 14px; }
  .deck-stat { font-size: 13px; color: var(--text); }
  .deck-stat b { color: var(--accent); }
  .deck-roles { font-size: 11px; color: var(--muted); margin-top: 4px; }
  .card-tile a { text-decoration: none; color: inherit; display:block; }
  .card-tile .cap { display:none; }
  .card-tile.loading { aspect-ratio: 63/88; display:flex; align-items:center; justify-content:center; color: var(--muted); font-size:12px; }
  .card-tile.missing { aspect-ratio: 63/88; display:flex; align-items:center; justify-content:center; color: var(--danger); font-size:12px; text-align:center; padding:8px; }
  .empty-note { color: var(--muted); font-size: 13px; padding: 8px; grid-column: 1/-1; }

  /* ---- Deck editor (workbench phase 2) ---- */
  .deck-toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
  .deck-toolbar select, .deck-toolbar .tb-btn, .add-wrap input {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 7px; padding: 6px 9px; font: inherit; font-size: 13px;
  }
  .deck-toolbar select:focus, .add-wrap input:focus { outline: none; border-color: var(--accent); }
  .deck-toolbar .tb-btn { cursor: pointer; color: var(--muted); }
  .deck-toolbar .tb-btn:hover:not(:disabled) { color: var(--text); border-color: var(--accent); }
  .deck-toolbar .tb-btn:disabled { opacity: .45; cursor: default; }
  .add-wrap { position: relative; flex: 1 1 200px; min-width: 160px; }
  .add-wrap input { width: 100%; }
  .ac-list { position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 30; margin: 0; padding: 4px;
    list-style: none; background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px;
    box-shadow: 0 10px 28px rgba(0,0,0,.5); max-height: 280px; overflow-y: auto; }
  .ac-list[hidden] { display: none; }
  .ac-list li { padding: 6px 9px; border-radius: 5px; cursor: pointer; font-size: 13px; }
  .ac-list li.sel, .ac-list li:hover { background: var(--user); color: #fff; }
  .deck-warns { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 7px; }
  .deck-warn { font-size: 11.5px; padding: 2px 8px; border-radius: 10px; border: 1px solid var(--danger);
    color: #f2b8b4; background: rgba(217,86,79,.1); }
  .deck-warn.hint { border-color: var(--border); color: var(--muted); background: transparent; }
  .role-group.empty-group { display: none; }
  body.dragging .role-group.empty-group { display: block; }
  body.dragging .role-group .role-grid { min-height: 56px; border: 1px dashed var(--border); border-radius: 9px; padding: 4px; }
  .role-group.drop-over .role-grid { border-color: var(--accent) !important; background: rgba(201,150,63,.07); }
  .card-tile.commander { box-shadow: 0 0 0 2px var(--accent-2); }
  .card-tile.dragging-src { opacity: .35; }
  .card-tile .tag-dot { position: absolute; bottom: 5px; left: 5px; background: rgba(0,0,0,.82); color: var(--accent);
    font-size: 10.5px; font-weight: 600; padding: 1px 6px; border-radius: 10px; pointer-events: none;
    max-width: 70%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tile-actions { position: absolute; top: 5px; right: 5px; display: none; gap: 3px; }
  .tile-actions button, .tile-add { background: rgba(0,0,0,.85); color: #fff; border: 1px solid var(--border);
    border-radius: 6px; width: 24px; height: 24px; font-size: 14px; line-height: 1; cursor: pointer; padding: 0; }
  .tile-actions button:hover, .tile-add:hover { border-color: var(--accent); color: var(--accent); }
  .tile-actions button.rm:hover { border-color: var(--danger); color: var(--danger); }
  @media (hover: hover) { .card-tile:hover .tile-actions { display: flex; } }
  .tile-add { position: absolute; top: 5px; right: 5px; width: auto; padding: 0 8px; font-size: 12px; font-weight: 600; display: none; }
  body.has-deck .card-tile .tile-add { display: block; }
  #newDeckBtn { background: transparent; color: var(--muted); border: 1px solid var(--border); border-radius: 7px;
    padding: 4px 10px; cursor: pointer; font-size: 12px; }
  #newDeckBtn:hover { color: var(--text); border-color: var(--accent); }
  body.has-deck #newDeckBtn { display: none; }

  /* Card editor modal */
  .editor { position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,.78);
    display: flex; align-items: center; justify-content: center; padding: 16px; }
  .editor[hidden] { display: none; }
  .ed-inner { display: flex; gap: 20px; align-items: flex-start; background: var(--panel); border: 1px solid var(--border);
    border-radius: 14px; padding: 18px; max-width: 720px; width: 100%; max-height: 100%; overflow-y: auto; }
  .ed-img { width: 260px; max-width: 42%; border-radius: 12px; flex-shrink: 0; }
  .ed-side { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 12px; }
  .ed-name { font-size: 17px; font-weight: 650; margin: 0; }
  .ed-type { color: var(--muted); font-size: 13px; margin-top: -8px; }
  .ed-flags { display: flex; flex-wrap: wrap; gap: 6px; }
  .ed-flag { font-size: 11.5px; padding: 2px 8px; border-radius: 10px; border: 1px solid var(--accent); color: var(--accent); }
  .ed-flag.bad { border-color: var(--danger); color: #f2b8b4; }
  .ed-row label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin-bottom: 5px; }
  .ed-row select, .ed-row input { width: 100%; background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 7px; padding: 7px 9px; font: inherit; font-size: 13px; }
  .stepper { display: inline-flex; align-items: center; border: 1px solid var(--border); border-radius: 7px; overflow: hidden; }
  .stepper button { background: var(--panel-2); color: var(--text); border: none; width: 32px; height: 30px; font-size: 16px; cursor: pointer; }
  .stepper button:hover { color: var(--accent); }
  .stepper span { min-width: 36px; text-align: center; font-weight: 600; }
  .ed-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
  .ed-actions button, .ed-actions a { background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 7px; padding: 7px 12px; font: inherit; font-size: 13px; cursor: pointer; text-decoration: none; }
  .ed-actions button:hover, .ed-actions a:hover { border-color: var(--accent); }
  .ed-actions .danger:hover { border-color: var(--danger); color: var(--danger); }
  .ed-actions .primary { background: var(--accent); color: #1a1400; border-color: var(--accent); font-weight: 650; }
  .ed-inner { position: relative; }
  .ed-close { position: absolute; top: 8px; right: 12px; background: none; border: none; color: var(--muted); font-size: 24px; cursor: pointer; line-height: 1; }
  .ed-close:hover { color: var(--text); }
  .ed-name { padding-right: 24px; }
  @media (max-width: 560px) {
    .ed-inner { flex-direction: column; align-items: center; }
    .ed-img { width: 200px; max-width: 70%; }
    .ed-side { width: 100%; }
  }

  /* Deck brief (commander picker + questionnaire) */
  .intake { position: fixed; inset: 0; z-index: 110; background: rgba(0,0,0,.78);
    display: flex; align-items: flex-start; justify-content: center; padding: 16px; overflow-y: auto; }
  .intake[hidden] { display: none; }
  .in-inner { position: relative; background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
    padding: 20px 20px 16px; width: 100%; max-width: 640px; margin: auto 0; }
  .in-title { margin: 0; font-size: 18px; }
  .in-sub { margin: 4px 0 6px; color: var(--muted); font-size: 13px; }
  .intake section { margin-top: 16px; }
  .intake h3 { margin: 0 0 7px; font-size: 11.5px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); font-weight: 650; }
  .in-hint { text-transform: none; letter-spacing: 0; font-weight: 400; color: var(--muted); opacity: .8; font-size: 12px; }
  .intake textarea, .intake input { width: 100%; background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 10px; font: inherit; font-size: 13.5px; resize: vertical; }
  .intake textarea:focus, .intake input:focus { outline: none; border-color: var(--accent); }
  .in-row { display: flex; gap: 8px; margin-top: 8px; }
  /* type=search (keeps password managers away) without the browser's search styling */
  input[type=search] { -webkit-appearance: none; appearance: none; }
  input[type=search]::-webkit-search-cancel-button, input[type=search]::-webkit-search-decoration { -webkit-appearance: none; }
  .in-small { background: var(--panel-2); color: var(--text); border: 1px solid var(--border); border-radius: 8px;
    padding: 0 12px; cursor: pointer; font: inherit; font-size: 13px; }
  .in-small:hover { border-color: var(--accent); }
  .in-cmdrs { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; max-height: 300px; overflow-y: auto; }
  .in-cmdr { background: var(--panel-2); border: 2px solid transparent; border-radius: 9px; padding: 4px; cursor: pointer;

  .in-cmdr.sel { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(201,150,63,.35); }

    padding: 5px 11px; cursor: pointer; font: inherit; font-size: 12.5px; }
  .in-pill:hover, .in-chip:hover { color: var(--text); }
  .in-pill.sel, .in-chip.sel { background: var(--chip); color: var(--accent); border-color: var(--accent); }
  .in-avoid-note { margin-top: 8px; }
  .in-two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .in-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
  .in-actions button { border-radius: 8px; padding: 8px 16px; font: inherit; font-size: 13.5px; cursor: pointer;
    background: var(--panel-2); color: var(--text); border: 1px solid var(--border); }
  .in-actions .primary { background: var(--accent); color: #1a1400; border-color: var(--accent); font-weight: 650; }
  @media (max-width: 560px) { .in-two { grid-template-columns: 1fr; } }

  .toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 120;
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 9px; padding: 9px 14px;
    font-size: 13px; box-shadow: 0 10px 30px rgba(0,0,0,.5); display: flex; gap: 12px; align-items: center; }
  .toast[hidden] { display: none; }

  /* Chat sidebar */

    display: flex; flex-direction: column; min-height: 0; }

    border-radius: 9px; font-weight: 650; cursor: pointer; font-size: 13px; }
  #chatlist { flex: 1; overflow-y: auto; padding: 0 8px 12px; display: flex; flex-direction: column; gap: 2px; }

    cursor: pointer; padding: 0 6px; line-height: 1; }

  @media (max-width: 820px) {
    main { flex-direction: column; }
    #chat { border-right: none; border-bottom: 1px solid var(--border); }
    #canvas { min-height: 240px; max-height: 45vh; }

</style>
</head>
<body>
  <header>
    <button id="sidebarToggle" title="Toggle chat list">☰</button>

      <div id="cards"></div>

  </main>

<script>
// Stamped by the server (fingerprint of this file). If the app is updated while this tab
// is open, the server's version changes and we ask the user to refresh.
const UI_VERSION = '__UI_VERSION__';
function showStaleBanner() {
  if (document.getElementById('staleBanner')) return;
  const b = document.createElement('div');
  b.id = 'staleBanner';
  b.innerHTML = 'The app was updated. <button>Refresh</button> to get the latest version - your chats are saved.';
  b.querySelector('button').onclick = () => location.reload();
  document.body.prepend(b);
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  fetch('/version').then(r => r.ok ? r.json() : null)
    .then(v => { if (v && v.ui && v.ui !== UI_VERSION) showStaleBanner(); }).catch(() => {});
});

// Login gate: if the session cookie expired, any API call comes back 401 -
// send the user to the sign-in page (chats live in localStorage, so nothing is lost).
const _fetch = window.fetch.bind(window);
window.fetch = async (...args) => {
  const resp = await _fetch(...args);
  if (resp.status === 401) location.href = '/login';
  return resp;
};
_fetch('/me').then(r => r.ok ? r.json() : null).then(me => {
  if (!me || !me.auth) return;
  const btn = document.getElementById('logoutBtn');
  btn.textContent = 'Sign out (' + me.user + ')';
  btn.hidden = false;
}).catch(() => {});

let SESSION_ID = (crypto.randomUUID && crypto.randomUUID()) ||
                 (Date.now() + '-' + Math.random().toString(16).slice(2));

// ---- multi-chat persistence + sidebar (survives reloads) ----
const STORE_KEY = 'mtg_advisor_chats_v1';
let conversation = [];   // active chat's messages [{role, text}]
let deck = null;         // active chat's deck object { commander:[], bracket, cards:[...] }
let activeId = null;
let chats = {};          // id -> {id, title, sessionId, conversation, deck, updatedAt}

function newId() {
  return (crypto.randomUUID && crypto.randomUUID()) || (Date.now() + '-' + Math.random().toString(16).slice(2));
}
function loadStore() {
  try {
    const s = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
    if (s) { chats = s.chats || {}; activeId = s.activeId || null; }
  } catch (e) {}
}
function saveState() {  // fold the active chat back into the store, persist, redraw sidebar
  if (activeId && chats[activeId]) {
    const ch = chats[activeId];
    ch.conversation = conversation;
    ch.deck = deck;
    ch.sessionId = SESSION_ID;
    ch.updatedAt = Date.now();
    if (!ch.title || ch.title === 'New chat') {
      const firstUser = conversation.find(m => m.role === 'user');
      if (firstUser) ch.title = firstUser.text.replace(/\s+/g, ' ').slice(0, 42);
    }
  }
  try { localStorage.setItem(STORE_KEY, JSON.stringify({ activeId, chats })); } catch (e) {}
  renderSidebar();
}
function renderSidebar() {
  const list = document.getElementById('chatlist');
  if (!list) return;
  const rows = Object.values(chats).sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
  list.innerHTML = '';
  for (const ch of rows) {
    const row = document.createElement('div');
    row.className = 'chat-row' + (ch.id === activeId ? ' active' : '');
    row.innerHTML = '<span class="ct-title"></span><button class="ct-del" title="Delete chat">×</button>';
    row.querySelector('.ct-title').textContent = ch.title || 'New chat';
    row.addEventListener('click', (e) => { if (!e.target.classList.contains('ct-del')) switchChat(ch.id); });
    row.querySelector('.ct-del').addEventListener('click', (e) => { e.stopPropagation(); deleteChat(ch.id); });
    list.appendChild(row);
  }
}
function loadActiveIntoUI() {
  messagesEl.innerHTML = '';
  cardCache.clear(); seenNames.clear(); resetGroups(); deckIdentity = null;
  resetCanvas(); undoStack = []; closeEditor();
  renderDeck();  // before messages, so their card mentions know what's already in the deck
  if (!conversation.length) {
    addMessage('assistant', "Tell me your commander and what you're working on — a decklist to tune, a brand-new build, or a specific problem (curve, mana, a matchup). Cards I mention appear on the right.");
  } else {
    for (const m of conversation) {
      const b = addMessage(m.role, m.text, m.note);
      if (m.role === 'assistant') renderTurnExtras(m, b);
      if (m.role === 'assistant' && deckIdentity === null) {
        const mm = m.text.match(/%%IDENTITY:([WUBRGC]+)%%/i);
        if (mm) setDeckIdentity(mm[1].toUpperCase());
      }
    }
  }
  const ident = commanderIdentity();
  if (ident) setDeckIdentity([...ident].join('') || 'C');
  scrollToBottom();
}
function switchChat(id) {
  if (!chats[id]) return;
  activeId = id;
  SESSION_ID = chats[id].sessionId || newId();
  conversation = chats[id].conversation || [];
  deck = chats[id].deck || null;
  loadActiveIntoUI();
  saveState();
  if (window.innerWidth < 820) document.body.classList.add('nosidebar');
}
function newChat() {
  const id = newId();
  chats[id] = { id, title: 'New chat', sessionId: newId(), conversation: [], deck: null, updatedAt: Date.now() };
  activeId = id; SESSION_ID = chats[id].sessionId; conversation = []; deck = null;
  loadActiveIntoUI();
  saveState();
  if (window.innerWidth < 820) document.body.classList.add('nosidebar');
}
async function deleteChat(id) {
  const ch = chats[id];
  if (ch && ch.sessionId) {
    try { await fetch('/reset', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ session_id: ch.sessionId }) }); } catch (e) {}
  }
  delete chats[id];
  if (activeId === id) {
    const rows = Object.values(chats).sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
    if (rows.length) switchChat(rows[0].id);
    else newChat();
  } else { saveState(); }
}
function initChats() {
  loadStore();
  if (activeId && chats[activeId]) {
    SESSION_ID = chats[activeId].sessionId || newId();
    conversation = chats[activeId].conversation || [];
    deck = chats[activeId].deck || null;
    loadActiveIntoUI();
    saveState();
  } else {
    const rows = Object.values(chats).sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
    if (rows.length) switchChat(rows[0].id);
    else newChat();
  }
  if (window.innerWidth < 820) document.body.classList.add('nosidebar');
}

const messagesEl = document.getElementById('messages');
const cardsEl = document.getElementById('cards');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('send');
const newChatBtn = document.getElementById('newChat');
const sidebarToggle = document.getElementById('sidebarToggle');

const cardCache = new Map();   // canonical/lookup name -> {status, tile, img, group}
const seenNames = new Set();   // names already requested
let scryfallQueue = Promise.resolve();

// The canvas has two areas: the DECK (the editable deck object, when there is one)
// and MENTIONS (cards the advisor names in chat). With no deck, mentions are grouped
// by concrete role; with a deck, mentions that aren't in it collect in one
// "Mentioned in chat" group with a quick "+ Add" button.
const deckView = document.createElement('div');
const mentionView = document.createElement('div');
function resetCanvas() {
  cardsEl.innerHTML = '';
  deckView.innerHTML = ''; mentionView.innerHTML = '';
  cardsEl.appendChild(deckView); cardsEl.appendChild(mentionView);
  toolbarEl = null;
  mentionView.innerHTML = '<div class="empty-note">Cards the advisor mentions will show up here.</div>';
}

// ---- mention grouping by concrete role (from the otag index, sent by /card) ----
const ROLE_ORDER = ['Mentioned','Commander','Ramp','Draw','Tutor','Recursion','Target Interaction','Mass Interaction',
                    'Protection','Stax','Other','Lands','Unresolved','Loading'];
const roleGroups = {};   // role -> { section, grid, title, n }
function resetGroups() { for (const k in roleGroups) delete roleGroups[k]; }
function updateGroupTitle(role) {
  const g = roleGroups[role];
  if (!g) return;
  const label = role === 'Mentioned' ? 'Mentioned in chat · not in deck' : role;
  g.title.textContent = role === 'Loading' ? `Loading… · ${g.n}` : `${label} · ${g.n}`;
  g.section.style.display = g.n > 0 ? '' : 'none';  // hide empty groups (e.g. Loading when done)
}
function ensureGroup(role) {
  if (roleGroups[role]) return roleGroups[role];
  const section = document.createElement('div'); section.className = 'role-group';
  const title = document.createElement('div'); title.className = 'role-group-title';
  const grid = document.createElement('div'); grid.className = 'role-grid';
  section.appendChild(title); section.appendChild(grid);
  roleGroups[role] = { section, grid, title, n: 0 };
  // (re)order all sections by ROLE_ORDER (appendChild moves existing nodes)
  Object.keys(roleGroups)
    .sort((a, b) => ((ROLE_ORDER.indexOf(a) + 1) || 999) - ((ROLE_ORDER.indexOf(b) + 1) || 999))
    .forEach(r => mentionView.appendChild(roleGroups[r].section));
  updateGroupTitle(role);
  return roleGroups[role];
}
function setTileGroup(entry, role) {
  if (entry.group === role) return;
  if (entry.group && roleGroups[entry.group]) { roleGroups[entry.group].n--; updateGroupTitle(entry.group); }
  const g = ensureGroup(role);
  g.grid.appendChild(entry.tile);
  entry.group = role; g.n++; updateGroupTitle(role);
}
function dropMentionTile(entry) {
  if (entry.group && roleGroups[entry.group]) { roleGroups[entry.group].n--; updateGroupTitle(entry.group); }
  entry.group = null; entry.inDeck = true;
  entry.tile.remove();
}
function mentionRole(entry) {
  if (deck) return 'Mentioned';
  return (entry.roles && entry.roles.length) ? entry.roles[0] : 'Other';
}
// Re-file every resolved mention after the deck appears/changes.
function regroupMentions() {
  for (const entry of new Set(cardCache.values())) {
    if (entry.status !== 'ok' || !entry.tile) continue;
    if (deck && deckFind(entry.canonical)) { if (!entry.inDeck) dropMentionTile(entry); continue; }
    if (entry.inDeck) { entry.inDeck = false; entry.group = null; }
    setTileGroup(entry, mentionRole(entry));
  }
}

// ---- deck object + manual editor (workbench phase 2) ----
// deck = { commander:[names], bracket:1-5|null, not_found:[], cards:[{name, qty, roles, role, tags, ...}] }
const DECK_ROLES = ['Commander','Ramp','Draw','Tutor','Recursion','Target Interaction','Mass Interaction',
                    'Protection','Stax','Enabler','Payoff','Force Multiplier','Threats','Finisher','Misc Value',
                    'Other','Lands'];
const BRACKETS = { 1: 'Exhibition', 2: 'Core', 3: 'Upgraded', 4: 'Optimized', 5: 'cEDH' };
const GC_CAP = { 1: 0, 2: 0, 3: 3 };  // game-changer caps; 4-5 unlimited
let toolbarEl = null;
let deckTiles = new Map();  // lower(name) -> tile (for flashCard)
let undoStack = [];

function looksLikeDeck(text) {
  if (/moxfield\.com|archidekt\.com|commandertemplate\.com|tappedout\.net|mtggoldfish\.com|deckstats\.net/i.test(text)) return true;
  return (text.match(/^\s*\d+\s*[xX]?\s+\S/gm) || []).length >= 15;  // "1 Sol Ring" or "1x Sol Ring"
}
async function loadDeckFromText(text) {
  try {
    const resp = await fetch('/deck/parse', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text }),
    });
    if (!resp.ok) return false;
    const data = await resp.json();
    if (data.error) { showToast(data.error); return false; }  // e.g. Moxfield blocks import
    if (!data.cards || !data.cards.length) return false;
    pushUndo();  // a pasted list replaces the cards - keep the old deck undoable
    deck = deck || { commander: [], bracket: null, cards: [] };
    deck.cards = data.cards;
    deck.not_found = data.not_found || [];
    // a deck link knows its commander (and often its bracket); a pasted list doesn't
    if (data.commander && data.commander.length) deck.commander = data.commander.filter(n => deckFind(n));
    else deck.commander = (deck.commander || []).filter(n => deckFind(n));
    if (data.bracket >= 1 && data.bracket <= 5) deck.bracket = data.bracket;
    deckChanged();
    if (data.source) {
      showToast(`Imported "${data.name || 'deck'}" from ${data.source}`
        + (data.skipped ? ` (${data.skipped} maybeboard/sideboard cards left out)` : '')
        + (deck.not_found.length ? ` - ${deck.not_found.length} unresolved` : ''));
    } else if (data.skipped || deck.not_found.length) {
      showToast([data.skipped ? `${data.skipped} maybeboard/sideboard cards left out` : '',
                 deck.not_found.length ? `${deck.not_found.length} card(s) couldn't be resolved - see the deck header` : '']
                .filter(Boolean).join(' · '));
    }
    return true;
  } catch (e) { return false; }
}

// ---- deck -> advisor (phase 3): the AI gets the live deck + a note of edits since its last reply ----
function deckForChat() {
  if (!deck || !deck.cards || !deck.cards.length) return null;
  return { commander: deck.commander || [], bracket: deck.bracket || null, intake: deck.intake || null,
           cards: deck.cards.map(c => ({ name: c.name, qty: c.qty || 1, role: c.role || null,
                                         tags: c.tags || [], color_identity: c.color_identity || [] })) };
}
function deckSnapshot() {
  if (!deck || !deck.cards) return null;
  const q = {}; for (const c of deck.cards) q[c.name] = c.qty || 1;
  return { commander: [...(deck.commander || [])], bracket: deck.bracket || null, q,
           brief: JSON.stringify(deck.intake || null) };
}
function deckEditNote(prev, cur) {
  if (!prev || !cur) return '';
  const parts = [];
  const adds = Object.keys(cur.q).filter(n => !(n in prev.q));
  const cuts = Object.keys(prev.q).filter(n => !(n in cur.q));
  const qty = Object.keys(cur.q).filter(n => n in prev.q && prev.q[n] !== cur.q[n]);
  if (adds.length + cuts.length + qty.length > 25) {
    parts.push(`deck heavily changed (${adds.length} added, ${cuts.length} removed) - see CURRENT DECK`);
  } else {
    adds.forEach(n => parts.push(`+${cur.q[n] > 1 ? cur.q[n] + ' ' : ''}${n}`));
    cuts.forEach(n => parts.push(`-${n}`));
    qty.forEach(n => parts.push(`${n} ${prev.q[n]}->${cur.q[n]}`));
  }
  if (prev.commander.join('|') !== cur.commander.join('|'))
    parts.push(`commander -> ${cur.commander.join(' + ') || 'unset'}`);
  if (prev.bracket !== cur.bracket) parts.push(`bracket -> ${cur.bracket || 'unset'}`);
  if (prev.brief !== undefined && prev.brief !== cur.brief) parts.push('player updated their deck brief (see PLAYER BRIEF)');
  return parts.length ? `[Deck edits since your last reply: ${parts.join('; ')}]` : '';
}

const lc = s => (s || '').toLowerCase();
function deckFind(name) {
  if (!deck || !deck.cards || !name) return null;
  const k = lc(name);
  return deck.cards.find(c => lc(c.name) === k || lc(c.name).split(' // ')[0] === k) || null;
}
// Decks parsed before these flags existed lack them - fall back to the type line.
function canCommand(c) {
  const tl = c.type_line || '';
  // Backgrounds pair with a "Choose a Background" commander - never flag them (also fixes
  // decks saved before the server checked Scryfall's is:commander / t:background).
  return /Background/.test(tl) || (c.can_command ?? (/Legendary/.test(tl) && /Creature/.test(tl)));
}
function anyQty(c) { return c.any_qty ?? /Basic/.test(c.type_line || ''); }
function isCommander(c) { return !!(deck && (deck.commander || []).some(n => lc(n) === lc(c.name))); }
function autoGroup(c) { return c.is_land ? 'Lands' : ((c.roles && c.roles.length) ? c.roles[0] : 'Other'); }
function cardGroup(c) { return isCommander(c) ? 'Commander' : (c.role || autoGroup(c)); }
function commanderIdentity() {
  if (!deck || !(deck.commander || []).length) return null;
  const s = new Set();
  for (const n of deck.commander) { const c = deckFind(n); if (c) (c.color_identity || []).forEach(x => s.add(x)); }
  return s;
}

// Every edit: snapshot for undo -> mutate -> deckChanged() (persist + re-render).
function pushUndo() {
  undoStack.push(JSON.stringify(deck));
  if (undoStack.length > 40) undoStack.shift();
}
function undo() {
  if (!undoStack.length) return;
  deck = JSON.parse(undoStack.pop());
  deckChanged();
  if (editorName) { const c = deckFind(editorName); c ? renderEditor(c) : closeEditor(); }
}
function deckChanged() {
  saveState();
  renderDeck();
  regroupMentions();
  const ident = commanderIdentity();
  if (ident) setDeckIdentity([...ident].join('') || 'C');
}

function deckComposition() {
  const cards = (deck && deck.cards) || [];
  let total = 0, lands = 0, gc = 0, mvSum = 0, mvN = 0;
  const colors = new Set(); const roleCounts = {};
  const ident = commanderIdentity();
  const offColor = [], dupes = [];
  for (const c of cards) {
    const q = c.qty || 1; total += q;
    if (c.is_land) lands += q;
    else {
      if (!isCommander(c)) {
        const rs = c.role ? [c.role] : (c.roles || []);
        for (const r of rs) roleCounts[r] = (roleCounts[r] || 0) + q;
      }
      if (typeof c.cmc === 'number') { mvSum += c.cmc * q; mvN += q; }
    }
    if (c.game_changer) gc += q;
    for (const ci of (c.color_identity || [])) colors.add(ci);
    if (ident && (c.color_identity || []).some(x => !ident.has(x))) offColor.push(c.name);
    if (q > 1 && !anyQty(c)) dupes.push(c.name);
  }
  return { total, lands, gc, colors: ident ? [...ident] : [...colors], roleCounts, offColor, dupes,
           avgMv: mvN ? (mvSum / mvN) : 0 };
}

function startNewDeck() {
  pushUndo();
  deck = { commander: [], bracket: null, cards: [], not_found: [] };
  deckChanged();
  setTimeout(() => { const i = document.getElementById('addCardInput'); if (i) i.focus(); }, 0);
}

function buildToolbar() {
  const tb = document.createElement('div');
  tb.className = 'deck-toolbar';
  tb.innerHTML =
    '<div class="add-wrap"><input type="search" id="addCardInput" placeholder="Add a card…" ' + NO_AUTOFILL + '>'
    + '<ul class="ac-list" hidden></ul></div>'
    + '<select id="cmdrSelect" title="Commander"></select>'
    + '<select id="bracketSelect" title="Bracket"><option value="">Bracket…</option>'
    + Object.entries(BRACKETS).map(([n, l]) => `<option value="${n}">B${n} · ${l}</option>`).join('') + '</select>'
    + '<button class="tb-btn" id="undoBtn" title="Undo (Ctrl+Z)">↶ Undo</button>'
    + '<button class="tb-btn" id="copyDeckBtn" title="Copy the decklist in a format your deckbuilder imports">⧉ Export list ▾</button>'
    + '<button class="tb-btn" id="briefBtn" title="Commander, bracket, goals and limits for the advisor">📝 Brief</button>';
  const input = tb.querySelector('#addCardInput');
  const list = tb.querySelector('.ac-list');
  let acTimer = null, acItems = [], acSel = -1, acSeq = 0;
  const closeAc = () => { list.hidden = true; acItems = []; acSel = -1; };
  const paintAc = () => {
    list.innerHTML = '';
    acItems.forEach((n, i) => {
      const li = document.createElement('li');
      li.textContent = n; if (i === acSel) li.className = 'sel';
      li.addEventListener('mousedown', (e) => { e.preventDefault(); pick(n); });
      list.appendChild(li);
    });
    list.hidden = !acItems.length;
  };
  const pick = (n) => { input.value = ''; closeAc(); addCardByName(n); };
  input.addEventListener('input', () => {
    clearTimeout(acTimer);
    const q = input.value.trim();
    if (q.length < 2) { closeAc(); return; }
    acTimer = setTimeout(async () => {
      const seq = ++acSeq;
      try {
        const r = await fetch('/card/search?q=' + encodeURIComponent(q));
        const d = await r.json();
        if (seq !== acSeq) return;  // a newer keystroke already answered
        acItems = d.names || []; acSel = acItems.length ? 0 : -1; paintAc();
      } catch (e) {}
    }, 180);
  });
  input.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown' && acItems.length) { e.preventDefault(); acSel = (acSel + 1) % acItems.length; paintAc(); }
    else if (e.key === 'ArrowUp' && acItems.length) { e.preventDefault(); acSel = (acSel - 1 + acItems.length) % acItems.length; paintAc(); }
    else if (e.key === 'Enter') {
      e.preventDefault();
      if (acSel >= 0 && acItems[acSel]) pick(acItems[acSel]);
      else if (input.value.trim()) pick(input.value.trim());
    } else if (e.key === 'Escape') { closeAc(); }
  });
  input.addEventListener('blur', () => setTimeout(closeAc, 120));

  tb.querySelector('#cmdrSelect').addEventListener('change', (e) => {
    pushUndo();
    deck.commander = e.target.value ? [e.target.value] : [];
    deckChanged();
  });
  tb.querySelector('#bracketSelect').addEventListener('change', (e) => {
    pushUndo();
    deck.bracket = e.target.value ? Number(e.target.value) : null;
    deckChanged();
  });
  tb.querySelector('#undoBtn').addEventListener('click', undo);
  tb.querySelector('#copyDeckBtn').addEventListener('click', (e) => toggleExportMenu(e.currentTarget));
  tb.querySelector('#briefBtn').addEventListener('click', () => openIntake());
  return tb;
}
function syncToolbar() {
  const sel = toolbarEl.querySelector('#cmdrSelect');
  const cmdrs = deck.commander || [];
  const candidates = deck.cards.filter(c => canCommand(c) || isCommander(c)).map(c => c.name).sort();
  sel.innerHTML = '';
  const none = document.createElement('option'); none.value = ''; none.textContent = 'Commander…'; sel.appendChild(none);
  for (const n of candidates) { const o = document.createElement('option'); o.value = n; o.textContent = n; sel.appendChild(o); }
  if (cmdrs.length > 1) {  // partners: show them together, picking one from the list replaces both
    const o = document.createElement('option'); o.value = cmdrs[0]; o.textContent = cmdrs.join(' + ');
    o.selected = true; sel.appendChild(o);
  } else sel.value = cmdrs[0] || '';
  toolbarEl.querySelector('#bracketSelect').value = deck.bracket || '';
  toolbarEl.querySelector('#undoBtn').disabled = !undoStack.length;
}

function renderDeck() {
  document.body.classList.toggle('has-deck', !!deck);
  document.getElementById('canvasTitle').textContent = deck ? 'Deck' : 'Card canvas';
  if (!deck || !deck.cards) { deckView.innerHTML = ''; toolbarEl = null; return; }
  const scroll = cardsEl.scrollTop;
  const note = mentionView.querySelector('.empty-note');
  if (note) note.remove();
  if (!toolbarEl) { deckView.innerHTML = ''; toolbarEl = buildToolbar(); deckView.appendChild(toolbarEl); }
  syncToolbar();
  // everything below the toolbar is rebuilt on each change
  while (deckView.lastChild !== toolbarEl) deckView.removeChild(deckView.lastChild);

  const comp = deckComposition();
  const head = document.createElement('div');
  head.className = 'deck-head';
  const roleStr = DECK_ROLES.filter(r => comp.roleCounts[r]).map(r => `${r} ${comp.roleCounts[r]}`).join(' · ');
  const cap = GC_CAP[deck.bracket];
  head.innerHTML =
    `<div class="deck-stat"><b>${comp.total}</b>/100 cards · <b>${comp.lands}</b> lands · avg MV <b>${comp.avgMv.toFixed(2)}</b> · `
    + `${comp.colors.join('') || 'C'} · <b>${comp.gc}</b>${cap !== undefined ? '/' + cap : ''} game changer${comp.gc === 1 ? '' : 's'}</div>`
    + (roleStr ? `<div class="deck-roles">${roleStr}</div>` : '');
  const warns = document.createElement('div'); warns.className = 'deck-warns';
  const warn = (text, hint) => { const w = document.createElement('span'); w.className = 'deck-warn' + (hint ? ' hint' : ''); w.textContent = text; warns.appendChild(w); };
  if (!deck.cards.length) warn('Empty deck - add cards with the search box, or paste a list in chat', true);
  else {
    if (!(deck.commander || []).length) warn('No commander set - open 📝 Brief or pick one above', true);
    for (const n of deck.commander || []) {
      const c = deckFind(n);
      if (c && !canCommand(c)) warn(`${c.name} can't normally be a commander`);
    }
    if (comp.total !== 100) warn(comp.total < 100 ? `${100 - comp.total} short of 100` : `${comp.total - 100} over 100`);
    if (cap !== undefined && comp.gc > cap) warn(`${comp.gc - cap} game changer${comp.gc - cap > 1 ? 's' : ''} over the B${deck.bracket} cap`);
    if (comp.offColor.length) warn(`Off-color: ${comp.offColor.join(', ')}`);
    if (comp.dupes.length) warn(`Not singleton: ${comp.dupes.join(', ')}`);
    if (deck.not_found && deck.not_found.length) warn(`Unresolved from paste: ${deck.not_found.join(', ')}`);
  }
  if (warns.childNodes.length) head.appendChild(warns);
  deckView.appendChild(head);

  // group -> cards, in taxonomy order (plus any custom role names at the end)
  const byGroup = {};
  for (const c of deck.cards) (byGroup[cardGroup(c)] = byGroup[cardGroup(c)] || []).push(c);
  const order = DECK_ROLES.concat(Object.keys(byGroup).filter(g => !DECK_ROLES.includes(g)));
  const ident = commanderIdentity();
  deckTiles = new Map();
  for (const g of order) {
    const cards = (byGroup[g] || []).sort((a, b) => (a.cmc || 0) - (b.cmc || 0) || a.name.localeCompare(b.name));
    const section = document.createElement('div');
    section.className = 'role-group' + (cards.length ? '' : ' empty-group');
    section.dataset.group = g;
    const title = document.createElement('div'); title.className = 'role-group-title';
    title.textContent = `${g} · ${cards.reduce((s, c) => s + (c.qty || 1), 0)}`;
    const grid = document.createElement('div'); grid.className = 'role-grid';
    for (const c of cards) grid.appendChild(deckCardTile(c, ident));
    section.appendChild(title); section.appendChild(grid);
    bindDropZone(section);
    deckView.appendChild(section);
  }
  cardsEl.scrollTop = scroll;
}

function deckCardTile(c, ident) {
  const tile = document.createElement('div');
  tile.className = 'card-tile' + (c.game_changer ? ' gc' : '') + (isCommander(c) ? ' commander' : '');
  if (ident && (c.color_identity || []).some(x => !ident.has(x))) tile.classList.add('offcolor');
  tile.title = c.name + (c.qty > 1 ? ` (x${c.qty})` : '') + ' - click to edit, drag to change role';
  if (c.image) {
    const img = document.createElement('img'); img.loading = 'lazy'; img.src = c.image; img.alt = c.name; img.draggable = false;
    tile.appendChild(img);
  } else { tile.classList.add('missing'); tile.textContent = c.name; }
  if (c.qty > 1) { const q = document.createElement('span'); q.className = 'qty'; q.textContent = c.qty; tile.appendChild(q); }
  if (c.tags && c.tags.length) { const t = document.createElement('span'); t.className = 'tag-dot'; t.textContent = '#' + c.tags.join(' #'); tile.appendChild(t); }
  const acts = document.createElement('div'); acts.className = 'tile-actions';
  acts.innerHTML = '<button data-a="dec" title="One fewer">−</button><button data-a="inc" title="One more">+</button><button data-a="rm" class="rm" title="Remove">×</button>';
  acts.addEventListener('click', (e) => {
    e.stopPropagation();
    const a = e.target.dataset.a;
    if (a === 'inc') changeQty(c.name, +1);
    else if (a === 'dec') changeQty(c.name, -1);
    else if (a === 'rm') removeCard(c.name);
  });
  tile.appendChild(acts);
  tile.style.cursor = 'pointer';
  tile.addEventListener('click', () => openEditor(c.name));
  tile.draggable = true;
  tile.addEventListener('dragstart', (e) => {
    e.dataTransfer.setData('text/plain', c.name); e.dataTransfer.effectAllowed = 'move';
    tile.classList.add('dragging-src'); hideTooltip();
    setTimeout(() => document.body.classList.add('dragging'), 0);  // after the drag image is captured
  });
  tile.addEventListener('dragend', () => { tile.classList.remove('dragging-src'); document.body.classList.remove('dragging'); });
  deckTiles.set(lc(c.name), tile);
  return tile;
}
function bindDropZone(section) {
  section.addEventListener('dragover', (e) => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; section.classList.add('drop-over'); });
  section.addEventListener('dragleave', (e) => { if (!section.contains(e.relatedTarget)) section.classList.remove('drop-over'); });
  section.addEventListener('drop', (e) => {
    e.preventDefault(); section.classList.remove('drop-over'); document.body.classList.remove('dragging');
    const name = e.dataTransfer.getData('text/plain');
    if (name) setCardGroup(name, section.dataset.group);
  });
}

// ---- mutations ----
async function addCardByName(name) {
  if (!deck) { deck = { commander: [], bracket: null, cards: [], not_found: [] }; }
  const existing = deckFind(name);
  if (existing) {
    if (anyQty(existing)) changeQty(existing.name, +1);
    else { showToast(`${existing.name} is already in the deck`); flashCard(existing.name); }
    return;
  }
  try {
    const r = await fetch('/deck/card?name=' + encodeURIComponent(name));
    if (!r.ok) { showToast(`Couldn't find "${name}"`); return; }
    const c = await r.json();
    const again = deckFind(c.name);  // the canonical name may already be there
    if (again) { if (anyQty(again)) changeQty(again.name, +1); else { showToast(`${again.name} is already in the deck`); flashCard(again.name); } return; }
    pushUndo();
    deck.cards.push(c);
    deckChanged();
    showToast(`Added ${c.name}`, true);
    flashCard(c.name);
  } catch (e) { showToast(`Couldn't add "${name}"`); }
}
function changeQty(name, delta) {
  const c = deckFind(name); if (!c) return;
  if ((c.qty || 1) + delta < 1) { removeCard(name); return; }
  pushUndo();
  c.qty = (c.qty || 1) + delta;
  deckChanged();
  if (editorName) renderEditor(c);
}
function removeCard(name) {
  const c = deckFind(name); if (!c) return;
  pushUndo();
  deck.cards = deck.cards.filter(x => x !== c);
  deck.commander = (deck.commander || []).filter(n => lc(n) !== lc(c.name));
  deckChanged();
  if (editorName && lc(editorName) === lc(c.name)) closeEditor();
  showToast(`Removed ${c.name}`, true);
}
function toggleCommander(name) {
  const c = deckFind(name); if (!c) return;
  pushUndo();
  const cur = deck.commander || [];
  if (isCommander(c)) deck.commander = cur.filter(n => lc(n) !== lc(c.name));
  else deck.commander = cur.length >= 2 ? [c.name] : cur.concat(c.name);  // max 2 (partners)
  deckChanged();
  if (editorName) renderEditor(c);
}
function setCardGroup(name, group) {
  const c = deckFind(name); if (!c || cardGroup(c) === group) return;
  pushUndo();
  if (isCommander(c)) deck.commander = deck.commander.filter(n => lc(n) !== lc(c.name));
  if (group === 'Commander') deck.commander = (deck.commander || []).length >= 2 ? [c.name] : (deck.commander || []).concat(c.name);
  else c.role = (group === autoGroup(c)) ? null : group;  // dropping back on its natural group clears the override
  deckChanged();
}
function setCardRole(name, role) {
  const c = deckFind(name); if (!c) return;
  pushUndo();
  c.role = role || null;
  deckChanged();
  if (editorName) renderEditor(c);
}
function setCardTags(name, text) {
  const c = deckFind(name); if (!c) return;
  const tags = [...new Set(text.split(',').map(t => t.trim().replace(/^#/, '')).filter(Boolean))];
  if (JSON.stringify(tags) === JSON.stringify(c.tags || [])) return;
  pushUndo();
  c.tags = tags;
  deckChanged();
}
// Export formats. 'plain' imports almost anywhere (commander first, no header lines);
// 'archidekt' tags the commander so Archidekt sets it on import; 'arena' uses the
// Commander/Deck section headers MTG Arena-style importers expect.
const EXPORT_FORMATS = {
  plain: 'Plain list (most sites)',
  archidekt: 'Archidekt (commander tagged)',
  arena: 'MTG Arena style (Commander / Deck headers)',
};
function decklistText(format) {
  const cmdrs = deck.cards.filter(isCommander);
  const rest = deck.cards.filter(c => !isCommander(c)).sort((a, b) => a.name.localeCompare(b.name));
  const line = c => `${c.qty || 1} ${c.name}`;
  if (format === 'archidekt')
    return cmdrs.map(c => `${c.qty || 1}x ${c.name} [Commander{top}]`).concat(rest.map(c => `${c.qty || 1}x ${c.name}`)).join('\n');
  if (format === 'arena' && cmdrs.length)
    return `Commander\n${cmdrs.map(line).join('\n')}\n\nDeck\n${rest.map(line).join('\n')}`;
  return cmdrs.concat(rest).map(line).join('\n');
}
function copyDecklist(format = 'plain') {
  if (!deck || !deck.cards.length) return;
  navigator.clipboard.writeText(decklistText(format)).then(
    () => showToast(`Decklist copied - ${EXPORT_FORMATS[format]}`
                    + (format === 'plain' && (deck.commander || []).length ? '. Commander is on the first line.' : '')),
    () => showToast("Couldn't copy - clipboard blocked"));
}
function toggleExportMenu(btn) {
  let menu = document.getElementById('exportMenu');
  if (menu) { menu.remove(); return; }
  menu = document.createElement('div');
  menu.id = 'exportMenu'; menu.className = 'export-menu';
  for (const [key, label] of Object.entries(EXPORT_FORMATS)) {
    const b = document.createElement('button'); b.type = 'button'; b.textContent = label;
    b.onclick = () => { menu.remove(); copyDecklist(key); };
    menu.appendChild(b);
  }
  btn.parentElement.style.position = 'relative';
  menu.style.top = (btn.offsetTop + btn.offsetHeight + 4) + 'px';
  menu.style.left = btn.offsetLeft + 'px';
  btn.parentElement.appendChild(menu);
  setTimeout(() => document.addEventListener('click', function off(e) {
    if (!menu.contains(e.target)) { menu.remove(); document.removeEventListener('click', off); }
  }), 0);
}

// ---- deck brief: commander picker + intake questionnaire (workbench phase 4) ----
// Password-manager extensions treat plain text boxes in a form as contact/address fields and pop
// autofill over them; type=search plus their documented ignore hints keeps them out.
const NO_AUTOFILL = 'autocomplete="off" data-1p-ignore data-lpignore="true" data-bwignore="true" data-form-type="other" data-protonpass-ignore="true"';
// Opens automatically when a pasted/linked deck arrives (before the advisor answers) and
// from the toolbar's Brief button. Answers live on deck.intake and reach the advisor as a
// PLAYER BRIEF inside the CURRENT DECK block.
const INTAKE_STYLES = ['Combo', 'Value engine', 'Aristocrats', 'Tokens / go-wide', 'Voltron', 'Aggro',
                       'Control', 'Stax', 'Spellslinger', 'Tribal', 'Big mana', 'Group hug / politics'];
const INTAKE_AVOID = ['Infinite combos', 'Game changers', 'Stax / tax effects', 'Mass land destruction',
                      'Extra turns', 'Tutors', 'Board wipes', 'Counterspells'];
const intakeEl = document.createElement('div');
intakeEl.className = 'intake'; intakeEl.hidden = true;
document.body.appendChild(intakeEl);
let intakeResolve = null;

function openIntake(opts = {}) {
  if (!deck || !deck.cards) return Promise.resolve(false);
  hideTooltip();
  return new Promise(resolve => { intakeResolve = resolve; renderIntake(opts); intakeEl.hidden = false; });
}
function closeIntake(saved) {
  intakeEl.hidden = true;
  const r = intakeResolve; intakeResolve = null;
  if (r) r(saved);
}
function renderIntake(opts) {
  const brief = Object.assign({ plan: '', styles: [], keep: [], avoid: [], avoidNote: '', budget: '', notes: '' },
                              deck.intake || {});
  let cmdrs = [...(deck.commander || [])];
  let bracket = deck.bracket || null;
  const esc = s => escapeHtml(String(s || '')).replace(/"/g, '&quot;');
  intakeEl.innerHTML = `<form class="in-inner" autocomplete="off">
    <button type="button" class="ed-close in-x" title="Close">×</button>
    <h2 class="in-title">Deck brief</h2>
    <p class="in-sub">${opts.fromSend ? 'Before the advisor reads your deck - ' : ''}tell it who leads the deck and what you're going for.
      Everything but the commander is optional.</p>
    <section><h3>Commander <span class="in-hint">pick up to 2 (partners / Background)</span></h3>
      <div class="in-cmdrs"></div>
      <div class="in-row"><input type="search" class="in-cmdr-search" ${NO_AUTOFILL} placeholder="Not listed? Add your commander by name…"><button type="button" class="in-small in-cmdr-add">Add</button></div></section>
    <section><h3>Target bracket</h3><div class="in-pills in-bracket"></div></section>
    <section><h3>Gameplan <span class="in-hint">how do you want to win?</span></h3>
      <textarea class="in-plan" rows="3" ${NO_AUTOFILL} placeholder="e.g. Drain everyone out with sacrifice triggers; Gut is a payoff, the treasure engine is the deck.">${esc(brief.plan)}</textarea>
      <div class="in-chips in-styles"></div></section>
    <section><h3>Must keep <span class="in-hint">pet cards the advisor should never suggest cutting</span></h3>
      <div class="in-row"><input type="search" class="in-keep-input" list="inKeepList" ${NO_AUTOFILL} placeholder="Type a card from your deck…"><button type="button" class="in-small in-keep-add">Add</button></div>
      <datalist id="inKeepList">${deck.cards.map(c => `<option value="${esc(c.name)}">`).join('')}</datalist>
      <div class="in-chips in-keep"></div></section>
    <section><h3>Avoid <span class="in-hint">things you don't want recommended</span></h3>
      <div class="in-chips in-avoid"></div>
      <input type="search" class="in-avoid-note" ${NO_AUTOFILL} placeholder="Anything else to avoid?" value="${esc(brief.avoidNote)}"></section>
    <section class="in-two"><div><h3>Budget</h3><input type="search" class="in-budget" ${NO_AUTOFILL} placeholder="e.g. under $10 a card" value="${esc(brief.budget)}"></div>
      <div><h3>Playgroup notes</h3><input type="search" class="in-notes" ${NO_AUTOFILL} placeholder="e.g. lots of flyers, no stax at our table" value="${esc(brief.notes)}"></div></section>
    <div class="in-actions"><button type="button" class="in-skip">Skip</button>
      <button type="submit" class="primary">${opts.fromSend ? 'Save & ask' : 'Save brief'}</button></div>
  </form>`;
  const $ = s => intakeEl.querySelector(s);

  const paintCmdrs = () => {
    const box = $('.in-cmdrs'); box.innerHTML = '';
    const cands = deck.cards.filter(c => canCommand(c) || cmdrs.some(n => lc(n) === lc(c.name)));
    if (!cands.length) box.innerHTML = '<div class="in-hint">No legal commanders found in the list - add yours below.</div>';
    for (const c of cands) {
      const t = document.createElement('button'); t.type = 'button';
      t.className = 'in-cmdr' + (cmdrs.some(n => lc(n) === lc(c.name)) ? ' sel' : '');
      t.title = c.name;
      t.innerHTML = (c.image ? `<img src="${esc(c.image)}" alt="">` : '') + `<span>${esc(c.name)}</span>`;
      t.onclick = () => {
        if (cmdrs.some(n => lc(n) === lc(c.name))) cmdrs = cmdrs.filter(n => lc(n) !== lc(c.name));
        else cmdrs = (cmdrs.length >= 2 ? cmdrs.slice(1) : cmdrs).concat(c.name);
        paintCmdrs();
      };
      box.appendChild(t);
    }
  };
  const addCmdr = async () => {
    const name = $('.in-cmdr-search').value.trim(); if (!name) return;
    const before = deck.cards.length;
    await addCardByName(name);
    // a new card was appended (canonical name may differ from what was typed), or it was already there
    const c = deck.cards.length > before ? deck.cards[deck.cards.length - 1] : deckFind(name);
    if (c && !cmdrs.some(n => lc(n) === lc(c.name))) cmdrs = (cmdrs.length >= 2 ? cmdrs.slice(1) : cmdrs).concat(c.name);
    $('.in-cmdr-search').value = ''; paintCmdrs();
  };
  $('.in-cmdr-add').onclick = addCmdr;
  $('.in-cmdr-search').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); addCmdr(); } });

  const paintPills = () => {
    const box = $('.in-bracket'); box.innerHTML = '';
    for (const [n, label] of Object.entries(BRACKETS)) {
      const b = document.createElement('button'); b.type = 'button';
      b.className = 'in-pill' + (bracket === Number(n) ? ' sel' : '');
      b.textContent = `B${n} ${label}`;

      box.appendChild(b);
    }
  };
  const chipGroup = (sel, options, list) => {
    const box = $(sel); box.innerHTML = '';
    for (const o of new Set([...options, ...list])) {
      const b = document.createElement('button'); b.type = 'button';
      b.className = 'in-chip' + (list.includes(o) ? ' sel' : '');
      b.textContent = o;
      b.onclick = () => { const i = list.indexOf(o); i >= 0 ? list.splice(i, 1) : list.push(o); chipGroup(sel, options, list); };
      box.appendChild(b);

  const styles = [...brief.styles], avoid = [...brief.avoid], keep = [...brief.keep];
  const addKeep = () => {
    const v = $('.in-keep-input').value.trim(); if (!v) return;
    const c = deckFind(v);
    if (!c) { showToast(`"${v}" isn't in the deck`); return; }
    if (!keep.includes(c.name)) keep.push(c.name);
    $('.in-keep-input').value = ''; chipGroup('.in-keep', [], keep);
  };
  $('.in-keep-add').onclick = addKeep;
  $('.in-keep-input').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); addKeep(); } });

  paintCmdrs(); paintPills();
  chipGroup('.in-styles', INTAKE_STYLES, styles);
  chipGroup('.in-avoid', INTAKE_AVOID, avoid);
  chipGroup('.in-keep', [], keep);

  $('.in-x').onclick = () => closeIntake(false);
  $('.in-skip').onclick = () => { deck.intakeSkipped = true; saveState(); closeIntake(false); };
  intakeEl.querySelector('form').onsubmit = (e) => {
    e.preventDefault();
    pushUndo();
    deck.commander = cmdrs.filter(n => deckFind(n));

// ---- advisor proposals (accept/reject) + questions (answer buttons) - workbench phase 3 ----
// Rendered under the assistant message that made them; stored on that conversation entry

function renderTurnExtras(entry, bubble) {
  const msg = bubble && bubble.closest('.msg');
  if (!msg || (!(entry.proposals || []).length && !entry.question)) return;
  let box = msg.querySelector('.turn-extras');
  if (!box) { box = document.createElement('div'); box.className = 'turn-extras'; msg.appendChild(box); }
  box.innerHTML = '';
  const props = entry.proposals || [];
  if (props.length) {
    const pending = props.filter(p => p.status === 'pending');
    const head = document.createElement('div'); head.className = 'prop-head';
    head.innerHTML = `<span>Proposed changes · ${props.length}</span>`;
    if (pending.length > 1 && deck) {
      const all = document.createElement('button'); all.className = 'prop-btn ok'; all.textContent = 'Accept all';
      all.onclick = async () => { pushUndo(); for (const p of pending) await acceptProposal(p, true); afterDecision(entry, bubble, `Accepted ${pending.length} changes`); };
      const none = document.createElement('button'); none.className = 'prop-btn'; none.textContent = 'Reject all';
      none.onclick = () => { pending.forEach(p => { p.status = 'rejected'; }); afterDecision(entry, bubble); };

function proposalCard(p, entry, bubble) {
  const card = document.createElement('div');
  card.className = 'prop-card ' + p.status;
  const cutCard = p.cut && deckFind(p.cut);
  if (cutCard && cutCard.image) p.cutImage = cutCard.image;  // remember it for after the cut
  const thumb = (src, cls) => src ? `<img class="prop-thumb ${cls}" src="${escapeHtml(src)}" alt="">` : '';
  const verb = p.cut && p.add ? 'Swap' : p.add ? 'Add' : 'Cut';
  card.innerHTML = `<div class="prop-thumbs">${thumb(p.cutImage, 'out')}${p.cut && p.add ? '<span class="prop-arrow">→</span>' : ''}${thumb(p.addCard && p.addCard.image, 'in')}</div>
    <div class="prop-body"><div class="prop-title"><span class="prop-verb">${verb}</span> ${p.cut ? `<s>${escapeHtml(p.cut)}</s>` : ''}${p.cut && p.add ? ' → ' : ''}${p.add ? `<b>${escapeHtml(p.add)}</b>` : ''}
      ${p.addCard && p.addCard.game_changer ? '<span class="prop-gc">game changer</span>' : ''}</div>
      <div class="prop-reason"></div><div class="prop-actions"></div></div>`;
  card.querySelector('.prop-reason').textContent = p.reason || '';
  const actions = card.querySelector('.prop-actions');
  if (p.status === 'pending' && deck) {
    const ok = document.createElement('button'); ok.className = 'prop-btn ok'; ok.textContent = 'Accept';
    ok.onclick = async () => { ok.disabled = true; await acceptProposal(p); afterDecision(entry, bubble, verb === 'Swap' ? `Swapped ${p.cut} → ${p.add}` : `${verb === 'Add' ? 'Added' : 'Cut'} ${p.add || p.cut}`); };
    const no = document.createElement('button'); no.className = 'prop-btn'; no.textContent = 'Reject';
    no.onclick = () => { p.status = 'rejected'; afterDecision(entry, bubble); };
    actions.append(ok, no);
  } else {
    actions.innerHTML = `<span class="prop-status">${p.status === 'accepted' ? '✓ Accepted' : p.status === 'rejected' ? '✗ Rejected' : 'No deck loaded'}</span>`;
  }
  // Optional reason - before or after deciding. It goes back to the advisor with the
  // decision ("rejected - I don't own it"), so it learns what this player values.
  if (deck) {
    const note = document.createElement('input');

    note.placeholder = p.status === 'pending' ? 'Why? (optional - e.g. "don\'t own it", "love the haste")' : 'Add a reason (optional)';
    note.value = p.note || '';
    for (const a of NO_AUTOFILL.match(/[\w-]+(="[^"]*")?/g)) {
      const [k, v] = a.split('='); note.setAttribute(k, v ? v.replace(/"/g, '') : '');
    }
    note.addEventListener('change', () => { p.note = note.value.trim(); saveState(); });
    note.addEventListener('keydown', e => { if (e.key === 'Enter') note.blur(); });
    actions.appendChild(note);
  }
  card.querySelectorAll('.prop-thumb').forEach(img => img.addEventListener('click', () => openLightbox({ img: img.src, canonical: '' })));
  return card;
}
// Apply one proposal to the deck. `quiet` = the caller already took the undo snapshot (Accept all).
async function acceptProposal(p, quiet) {
  if (!deck || p.status !== 'pending') return;
  if (!quiet) pushUndo();  // Accept all takes one snapshot for the whole batch
  if (p.cut) {
    const c = deckFind(p.cut);
    if (c && (c.qty || 1) > 1) {
      c.qty -= 1;  // "cut Forest" from 9 Forests = one fewer Forest, not all of them
    } else if (c) {
      deck.cards = deck.cards.filter(x => x !== c);
      deck.commander = (deck.commander || []).filter(n => lc(n) !== lc(c.name));
    }
  }
  if (p.add && !deckFind(p.add)) {
    try {
      const r = await fetch('/deck/card?name=' + encodeURIComponent(p.add));
      if (r.ok) deck.cards.push(await r.json());
    } catch (e) {}
  }
  p.status = 'accepted';
}

// ---- tiny markdown renderer (escape-first) ----
function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function renderMarkdown(raw) {
  let t = escapeHtml(raw);
  // Strip the machine identity marker so it never shows to the player.
  t = t.replace(/%%IDENTITY:[WUBRGC]+%%\s*/gi, '');
  // headers (### )
  t = t.replace(/^###\s+(.+)$/gm, '<h3>$1</h3>');
  // bold / italic / inline code
  t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  t = t.replace(/`([^`]+)`/g, '<code>$1</code>');
  // links [text](url)
  t = t.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  // bullet lists
  t = t.replace(/(?:^[-•]\s+.+(?:\n|$))+/gm, (block) => {
    const items = block.trim().split(/\n/).map(l => l.replace(/^[-•]\s+/, '')).map(li => `<li>${li}</li>`).join('');
    return `<ul>${items}</ul>`;
  });
  // numbered lists
  t = t.replace(/(?:^\d+\.\s+.+(?:\n|$))+/gm, (block) => {
    const items = block.trim().split(/\n/).map(l => l.replace(/^\d+\.\s+/, '')).map(li => `<li>${li}</li>`).join('');
    return `<ol>${items}</ol>`;
  });
  // card chips [[Name]]
  t = t.replace(/\[\[([^\]]+)\]\]/g, (_, name) => {
    const clean = name.trim();
    return `<span class="chip" data-card="${clean.replace(/"/g,'&quot;')}">${clean}</span>`;
  });
  // paragraphs / line breaks
  t = t.replace(/\n{2,}/g, '<br><br>').replace(/\n/g, '<br>');
  return t;
}

function bindChips(container) {
