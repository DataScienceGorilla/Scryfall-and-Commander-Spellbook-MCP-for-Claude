<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MTG Deckbuilding Advisor</title>
<style>
  :root {
    --bg: #14161a;
    --panel: #1c1f26;
    --panel-2: #232732;
    --border: #2e3340;
    --text: #e6e8ec;
    --muted: #9aa2b1;
    --accent: #c9963f;      /* MTG gold */
    --accent-2: #5a7fb5;
    --user: #2b3446;
    --chip: #3a2f18;
    --chip-border: #c9963f;
    --danger: #d9564f;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 15px/1.55 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    display: flex; flex-direction: column; height: 100vh;
  }
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 18px; border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 650; letter-spacing: .2px; }
  header .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); }
  header .spacer { flex: 1; }
  header button {
    background: transparent; color: var(--muted); border: 1px solid var(--border);
    border-radius: 7px; padding: 6px 12px; cursor: pointer; font-size: 13px;
  }
  header button:hover { color: var(--text); border-color: var(--accent); }

  main { flex: 1; display: flex; min-height: 0; }

  /* Chat pane */
  #chat { flex: 1.35; display: flex; flex-direction: column; min-width: 0; border-right: 1px solid var(--border); }
  #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
  .msg { max-width: 92%; }
  .msg .role { font-size: 11px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin-bottom: 5px; }
  .msg.user { align-self: flex-end; }
  .msg.user .bubble { background: var(--user); border: 1px solid var(--border); white-space: pre-wrap; }
  .bubble {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; padding: 12px 15px; white-space: normal; word-wrap: break-word;
  }
  .bubble h3 { font-size: 15px; margin: 12px 0 6px; color: var(--accent); }
  .bubble strong { color: #fff; }
  .bubble code { background: #0d0f13; padding: 1px 5px; border-radius: 4px; font-size: 13px; }
  .bubble ul, .bubble ol { margin: 6px 0; padding-left: 22px; }
  .bubble li { margin: 3px 0; }
  .bubble a { color: var(--accent-2); }

  .chip {
    display: inline; color: var(--accent); border-bottom: 1px dotted var(--chip-border);
    cursor: pointer; font-weight: 550;
  }
  .chip:hover { color: #f0c874; }

  .status {
    align-self: flex-start; font-size: 12.5px; color: var(--muted);
    display: flex; align-items: center; gap: 8px; padding: 2px 4px;
  }
  .status .gear { animation: spin 1.6s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .warn-banner {
    align-self: stretch; background: rgba(217,86,79,.14); border: 1px solid var(--danger);
    color: #f2b8b4; border-radius: 10px; padding: 10px 13px; font-size: 13px; line-height: 1.5;
  }
  .warn-banner strong { color: #fff; }

  /* Activity / thinking + tool trace */
  .activity {
    align-self: flex-start; max-width: 92%;
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 10px; padding: 9px 13px; font-size: 12.5px; color: var(--muted);
  }
  .activity .act-head { display: flex; align-items: center; gap: 8px; font-weight: 600; }
  .activity .gear { display: inline-block; animation: spin 1.6s linear infinite; }
  .activity.done .gear { animation: none; }
  .activity .dots::after { content: ''; animation: dots 1.4s steps(4, end) infinite; }
  @keyframes dots { 0%{content:'';} 25%{content:'.';} 50%{content:'..';} 75%{content:'...';} }
  .tool-line { display: flex; gap: 7px; margin-top: 7px; align-items: baseline; }
  .tool-line .tname { color: var(--accent); font-weight: 600; white-space: nowrap; }
  .tool-line .targs { color: var(--muted); opacity: .75; word-break: break-word; font-size: 12px; }

  /* Hover card preview */
  .card-tooltip {
    position: fixed; z-index: 60; width: 224px; border-radius: 11px; overflow: hidden;
    box-shadow: 0 12px 34px rgba(0,0,0,.65); pointer-events: none; display: none;
    background: #0d0f13; border: 1px solid var(--border);
  }
  .card-tooltip img { width: 100%; display: block; }
  .card-tooltip .tt-loading { padding: 16px; font-size: 12px; color: var(--muted); text-align: center; }

  /* Card lightbox (in-app enlarge; no navigation) */
  .lightbox { position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,.78);
    display: flex; align-items: center; justify-content: center; padding: 24px; }
  .lightbox[hidden] { display: none; }  /* author display:flex would otherwise defeat the hidden attribute */
  .lightbox .lb-inner { display: flex; flex-direction: column; align-items: center; gap: 10px; max-height: 100%; }
  .lightbox .lb-img { max-height: 80vh; max-width: 90vw; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,.6); }
  .lightbox .lb-bar { display: flex; align-items: center; gap: 16px; color: var(--text); font-size: 14px; }
  .lightbox .lb-name { font-weight: 600; }
  .lightbox .lb-link { color: var(--accent); text-decoration: none; font-size: 13px; }
  .lightbox .lb-link:hover { text-decoration: underline; }

  /* Input */
  #composer { border-top: 1px solid var(--border); padding: 12px; display: flex; gap: 10px; background: var(--panel); }
  #composer textarea {
    flex: 1; resize: none; background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px; padding: 11px 13px;
    font: inherit; max-height: 160px; min-height: 44px;
  }
  #composer textarea:focus { outline: none; border-color: var(--accent); }
  #send {
    background: var(--accent); color: #1a1400; border: none; border-radius: 10px;
    padding: 0 20px; font-weight: 650; cursor: pointer;
  }
  #send:disabled { opacity: .5; cursor: default; }

  /* Canvas pane */
  #canvas { flex: 1; display: flex; flex-direction: column; min-width: 300px; background: var(--panel); }
  #canvas .canvas-head { padding: 12px 16px; border-bottom: 1px solid var(--border); font-size: 13px; color: var(--muted); display:flex; align-items:center; gap:8px;}
  #cards { flex: 1; overflow-y: auto; padding: 14px; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; align-content: start; }
  .card-tile { position: relative; border-radius: 9px; overflow: hidden; background: var(--panel-2); border: 1px solid var(--border); transition: transform .12s, box-shadow .12s; }
  .card-tile.offcolor { box-shadow: 0 0 0 2px var(--danger); }
  .card-tile.offcolor::after { content: "⚠ off-color"; position: absolute; top: 6px; left: 6px; right: 6px; text-align: center; background: rgba(217,86,79,.92); color: #fff; font-size: 11px; font-weight: 600; padding: 3px 4px; border-radius: 5px; pointer-events: none; }
  .card-tile:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0,0,0,.45); }
  .card-tile.flash { box-shadow: 0 0 0 2px var(--accent); }
  .card-tile img { width: 100%; display: block; }
  .card-tile a { text-decoration: none; color: inherit; display:block; }
  .card-tile .cap { display:none; }
  .card-tile.loading { aspect-ratio: 63/88; display:flex; align-items:center; justify-content:center; color: var(--muted); font-size:12px; }
  .card-tile.missing { aspect-ratio: 63/88; display:flex; align-items:center; justify-content:center; color: var(--danger); font-size:12px; text-align:center; padding:8px; }
  .empty-note { color: var(--muted); font-size: 13px; padding: 8px; grid-column: 1/-1; }

  /* Chat sidebar */
  #sidebar { flex: 0 0 232px; width: 232px; background: var(--panel); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; min-height: 0; }
  body.nosidebar #sidebar { display: none; }
  #newChat { margin: 12px; padding: 9px 12px; background: var(--accent); color: #1a1400; border: none;
    border-radius: 9px; font-weight: 650; cursor: pointer; font-size: 13px; }
  #chatlist { flex: 1; overflow-y: auto; padding: 0 8px 12px; display: flex; flex-direction: column; gap: 2px; }
  .chat-row { display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-radius: 8px;
    cursor: pointer; color: var(--muted); font-size: 13px; }
  .chat-row:hover { background: var(--panel-2); color: var(--text); }
  .chat-row.active { background: var(--panel-2); color: var(--text); }
  .chat-row .ct-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chat-row .ct-del { opacity: 0; background: none; border: none; color: var(--muted); font-size: 16px;
    line-height: 1; cursor: pointer; padding: 0 2px; }
  .chat-row:hover .ct-del { opacity: .55; }
  .chat-row .ct-del:hover { color: var(--danger); opacity: 1; }
  #sidebarToggle { background: transparent; border: none; color: var(--muted); font-size: 18px;
    cursor: pointer; padding: 0 6px; line-height: 1; }
  #sidebarToggle:hover { color: var(--text); }

  @media (max-width: 820px) {
    main { flex-direction: column; }
    #chat { border-right: none; border-bottom: 1px solid var(--border); }
    #canvas { min-height: 240px; max-height: 45vh; }
    #sidebar { position: fixed; top: 49px; left: 0; bottom: 0; z-index: 40;
      box-shadow: 3px 0 18px rgba(0,0,0,.55); }
  }
</style>
</head>
<body>
  <header>
    <button id="sidebarToggle" title="Toggle chat list">☰</button>
    <span class="dot"></span>
    <h1>Commander Deckbuilding Advisor</h1>
    <span class="spacer"></span>
  </header>
  <main>
    <aside id="sidebar">
      <button id="newChat">+ New chat</button>
      <div id="chatlist"></div>
    </aside>
    <section id="chat">
      <div id="messages">
        <div class="msg assistant">
          <div class="role">Advisor</div>
          <div class="bubble">Tell me your commander and what you're working on — a decklist to tune, a brand-new build, or a specific problem (curve, mana, a matchup you keep losing). Cards I mention will appear on the right.</div>
        </div>
      </div>
      <div id="composer">
        <textarea id="input" placeholder="e.g. I'm building [[Krenko, Mob Boss]] goblins for bracket 3, here's my list..." rows="1"></textarea>
        <button id="send">Send</button>
      </div>
    </section>
    <section id="canvas">
      <div class="canvas-head">🃏 Card canvas <span class="spacer"></span></div>
      <div id="cards">
        <div class="empty-note">Cards the advisor mentions will show up here.</div>
      </div>
    </section>
  </main>

<script>
let SESSION_ID = (crypto.randomUUID && crypto.randomUUID()) ||
                 (Date.now() + '-' + Math.random().toString(16).slice(2));

// ---- multi-chat persistence + sidebar (survives reloads) ----
const STORE_KEY = 'mtg_advisor_chats_v1';
let conversation = [];   // active chat's messages [{role, text}]
let activeId = null;
let chats = {};          // id -> {id, title, sessionId, conversation, updatedAt}

function newId() {
  return (crypto.randomUUID && crypto.randomUUID()) || (Date.now() + '-' + Math.random().toString(16).slice(2));
}
function loadStore() {
  try {
    const s = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
    if (s) { chats = s.chats || {}; activeId = s.activeId || null; }
  } catch (e) {}
}
function saveState() {  // fold the active chat back into the store, persist, redraw sidebar
  if (activeId && chats[activeId]) {
    const ch = chats[activeId];
    ch.conversation = conversation;
    ch.sessionId = SESSION_ID;
    ch.updatedAt = Date.now();
    if (!ch.title || ch.title === 'New chat') {
      const firstUser = conversation.find(m => m.role === 'user');
      if (firstUser) ch.title = firstUser.text.replace(/\s+/g, ' ').slice(0, 42);
    }
  }
  try { localStorage.setItem(STORE_KEY, JSON.stringify({ activeId, chats })); } catch (e) {}
  renderSidebar();
}
function renderSidebar() {
  const list = document.getElementById('chatlist');
  if (!list) return;
  const rows = Object.values(chats).sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
  list.innerHTML = '';
  for (const ch of rows) {
    const row = document.createElement('div');
    row.className = 'chat-row' + (ch.id === activeId ? ' active' : '');
    row.innerHTML = '<span class="ct-title"></span><button class="ct-del" title="Delete chat">×</button>';
    row.querySelector('.ct-title').textContent = ch.title || 'New chat';
    row.addEventListener('click', (e) => { if (!e.target.classList.contains('ct-del')) switchChat(ch.id); });
    row.querySelector('.ct-del').addEventListener('click', (e) => { e.stopPropagation(); deleteChat(ch.id); });
    list.appendChild(row);
  }
}
function loadActiveIntoUI() {
  messagesEl.innerHTML = '';
  cardsEl.innerHTML = '<div class="empty-note">Cards the advisor mentions will show up here.</div>';
  cardCache.clear(); seenNames.clear(); deckIdentity = null;
  if (!conversation.length) {
    addMessage('assistant', "Tell me your commander and what you're working on — a decklist to tune, a brand-new build, or a specific problem (curve, mana, a matchup). Cards I mention appear on the right.");
  } else {
    for (const m of conversation) {
      addMessage(m.role, m.text);
      if (m.role === 'assistant' && deckIdentity === null) {
        const mm = m.text.match(/%%IDENTITY:([WUBRGC]+)%%/i);
        if (mm) setDeckIdentity(mm[1].toUpperCase());
      }
    }
  }
  scrollToBottom();
}
function switchChat(id) {
  if (!chats[id]) return;
  activeId = id;
  SESSION_ID = chats[id].sessionId || newId();
  conversation = chats[id].conversation || [];
  loadActiveIntoUI();
  saveState();
  if (window.innerWidth < 820) document.body.classList.add('nosidebar');
}
function newChat() {
  const id = newId();
  chats[id] = { id, title: 'New chat', sessionId: newId(), conversation: [], updatedAt: Date.now() };
  activeId = id; SESSION_ID = chats[id].sessionId; conversation = [];
  loadActiveIntoUI();
  saveState();
  if (window.innerWidth < 820) document.body.classList.add('nosidebar');
}
async function deleteChat(id) {
  const ch = chats[id];
  if (ch && ch.sessionId) {
    try { await fetch('/reset', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ session_id: ch.sessionId }) }); } catch (e) {}
  }
  delete chats[id];
  if (activeId === id) {
    const rows = Object.values(chats).sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
    if (rows.length) switchChat(rows[0].id);
    else newChat();
  } else { saveState(); }
}
function initChats() {
  loadStore();
  if (activeId && chats[activeId]) {
    SESSION_ID = chats[activeId].sessionId || newId();
    conversation = chats[activeId].conversation || [];
    loadActiveIntoUI();
    saveState();
  } else {
    const rows = Object.values(chats).sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
    if (rows.length) switchChat(rows[0].id);
    else newChat();
  }
  if (window.innerWidth < 820) document.body.classList.add('nosidebar');
}

const messagesEl = document.getElementById('messages');
const cardsEl = document.getElementById('cards');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('send');
const newChatBtn = document.getElementById('newChat');
const sidebarToggle = document.getElementById('sidebarToggle');

const cardCache = new Map();   // canonical/lookup name -> {status, tile, img}
const seenNames = new Set();   // names already requested
let scryfallQueue = Promise.resolve();

// Floating hover-preview tooltip
const tooltip = document.createElement('div');
tooltip.className = 'card-tooltip';
document.body.appendChild(tooltip);
let ttCard = null;

// In-app card lightbox (click a card -> enlarge here, never navigate away).
const lightbox = document.createElement('div');
lightbox.className = 'lightbox';
lightbox.hidden = true;
lightbox.innerHTML = '<div class="lb-inner"><img class="lb-img" alt=""><div class="lb-bar">'
  + '<span class="lb-name"></span><a class="lb-link" target="_blank" rel="noopener">View on Scryfall ↗</a>'
  + '</div></div>';
document.body.appendChild(lightbox);
lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeLightbox(); });

function openLightbox(entry) {
  hideTooltip();
  if (!entry || !entry.img) return;
  lightbox.querySelector('.lb-img').src = entry.img;
  lightbox.querySelector('.lb-name').textContent = entry.canonical || '';
  const link = lightbox.querySelector('.lb-link');
  if (entry.scryfall) { link.href = entry.scryfall; link.hidden = false; }
  else { link.hidden = true; }
  lightbox.hidden = false;
}
function closeLightbox() { lightbox.hidden = true; }

// Commander color-identity guardrail. deckIdentity is a Set of WUBRG letters
// (empty = colorless); null until the advisor declares it via %%IDENTITY:XX%%.
let deckIdentity = null;
function setDeckIdentity(letters) {
  const next = new Set(letters.replace(/C/g, '').split('').filter(Boolean));
  deckIdentity = next;
  // Re-evaluate any cards already on the canvas.
  for (const entry of cardCache.values()) evaluateTile(entry);
}
function evaluateTile(entry) {
  if (!entry || !entry.tile || deckIdentity === null || entry.status !== 'ok') return;
  const off = (entry.identity || []).some(c => !deckIdentity.has(c));
  entry.tile.classList.toggle('offcolor', off);
  if (off) entry.tile.title = `${entry.canonical || ''} is outside this deck's color identity`;
}

// ---- textarea auto-grow ----
inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + 'px';
});
inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
sendBtn.addEventListener('click', send);
newChatBtn.addEventListener('click', newChat);
sidebarToggle.addEventListener('click', () => document.body.classList.toggle('nosidebar'));

// ---- tiny markdown renderer (escape-first) ----
function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function renderMarkdown(raw) {
  let t = escapeHtml(raw);
  // Strip the machine identity marker so it never shows to the player.
  t = t.replace(/%%IDENTITY:[WUBRGC]+%%\s*/gi, '');
  // headers (### )
  t = t.replace(/^###\s+(.+)$/gm, '<h3>$1</h3>');
  // bold / italic / inline code
  t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  t = t.replace(/`([^`]+)`/g, '<code>$1</code>');
  // links [text](url)
  t = t.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  // bullet lists
  t = t.replace(/(?:^[-•]\s+.+(?:\n|$))+/gm, (block) => {
    const items = block.trim().split(/\n/).map(l => l.replace(/^[-•]\s+/, '')).map(li => `<li>${li}</li>`).join('');
    return `<ul>${items}</ul>`;
  });
  // numbered lists
  t = t.replace(/(?:^\d+\.\s+.+(?:\n|$))+/gm, (block) => {
    const items = block.trim().split(/\n/).map(l => l.replace(/^\d+\.\s+/, '')).map(li => `<li>${li}</li>`).join('');
    return `<ol>${items}</ol>`;
  });
  // card chips [[Name]]
  t = t.replace(/\[\[([^\]]+)\]\]/g, (_, name) => {
    const clean = name.trim();
    return `<span class="chip" data-card="${clean.replace(/"/g,'&quot;')}">${clean}</span>`;
  });
  // paragraphs / line breaks
  t = t.replace(/\n{2,}/g, '<br><br>').replace(/\n/g, '<br>');
  return t;
}

function bindChips(container) {
  container.querySelectorAll('.chip').forEach(chip => {
    if (chip._bound) return;
    chip._bound = true;
    const name = chip.getAttribute('data-card');
    requestCard(name);
    chip.addEventListener('click', () => flashCard(name));
    chip.addEventListener('mouseenter', (e) => { requestCard(name); showTooltip(name, e); });
    chip.addEventListener('mousemove', moveTooltip);
    chip.addEventListener('mouseleave', hideTooltip);
  });
}

// ---- hover preview ----
function showTooltip(name, e) {
  ttCard = keyFor(name);
  renderTooltip(name);
  tooltip.style.display = 'block';
  moveTooltip(e);
}
function renderTooltip(name) {
  if (ttCard !== keyFor(name)) return;
  const entry = cardCache.get(keyFor(name));
  if (entry && entry.img) {
    tooltip.innerHTML = `<img src="${entry.img}" alt="">`;
  } else if (entry && entry.status === 'missing') {
    tooltip.innerHTML = `<div class="tt-loading">"${name}" not found</div>`;
  } else {
    tooltip.innerHTML = `<div class="tt-loading">Loading ${name}…</div>`;
    setTimeout(() => renderTooltip(name), 250);  // refresh once the image loads
  }
}
function moveTooltip(e) {
  const pad = 16, w = 224, h = 312;
  let x = e.clientX + pad, y = e.clientY + pad;
  if (x + w > window.innerWidth) x = e.clientX - w - pad;
  if (y + h > window.innerHeight) y = Math.max(8, window.innerHeight - h - pad);
  tooltip.style.left = x + 'px';
  tooltip.style.top = y + 'px';
}
function hideTooltip() { ttCard = null; tooltip.style.display = 'none'; }

// ---- message rendering ----
function addMessage(role, text) {
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + role;
  wrap.innerHTML = `<div class="role">${role === 'user' ? 'You' : 'Advisor'}</div><div class="bubble"></div>`;
  const bubble = wrap.querySelector('.bubble');
  if (role === 'user') bubble.textContent = text;
  else { bubble.innerHTML = renderMarkdown(text); bindChips(bubble); }
  messagesEl.appendChild(wrap);
  scrollToBottom();
  return bubble;
}

// A per-turn activity strip: shows "Thinking…" immediately, then logs each tool
// call as it happens, and persists as a compact trace once the answer starts.
function addActivity() {
  const el = document.createElement('div');
  el.className = 'activity';
  el.innerHTML = `<div class="act-head"><span class="gear">⚙️</span><span class="act-title">Thinking</span><span class="dots"></span></div><div class="act-tools"></div>`;
  messagesEl.appendChild(el);
  scrollToBottom();
  const titleEl = el.querySelector('.act-title');
  const dotsEl = el.querySelector('.dots');
  const toolsEl = el.querySelector('.act-tools');
  let toolCount = 0;
  return {
    addTool(name, args) {
      toolCount++;
      titleEl.textContent = 'Working';
      const line = document.createElement('div');
      line.className = 'tool-line';
      line.innerHTML = `<span class="tname"></span><span class="targs"></span>`;
      line.querySelector('.tname').textContent = '🔧 ' + name;
      line.querySelector('.targs').textContent = args || '';
      toolsEl.appendChild(line);
      scrollToBottom();
    },
    stopSpinner() {
      el.classList.add('done');
      dotsEl.remove();
      titleEl.textContent = toolCount > 0
        ? `Used ${toolCount} tool${toolCount > 1 ? 's' : ''}`
        : 'Done';
    },
    finish() {
      this.stopSpinner();
      if (toolCount === 0) el.remove();  // nothing worth keeping for simple answers
    },
    get tools() { return toolCount; },
  };
}

function scrollToBottom() { messagesEl.scrollTop = messagesEl.scrollHeight; }

function renderWarning(cards) {
  if (!cards || !cards.length) return;
  const list = cards.map(c => `${c.name} (${c.identity})`).join(', ');
  const el = document.createElement('div');
  el.className = 'warn-banner';
  el.innerHTML = `<strong>⚠ Color-identity check:</strong> ${cards.length} recommended `
    + `card${cards.length > 1 ? 's are' : ' is'} outside this deck's color identity and `
    + `illegal here — ${escapeHtml(list)}. Ignore ${cards.length > 1 ? 'them' : 'it'}.`;
  messagesEl.appendChild(el);
  scrollToBottom();
}

// ---- Scryfall card canvas ----
function keyFor(name) { return name.toLowerCase(); }

function requestCard(name) {
  const key = keyFor(name);
  if (seenNames.has(key)) return;
  seenNames.add(key);

  // drop the empty note
  const note = cardsEl.querySelector('.empty-note');
  if (note) note.remove();

  const tile = document.createElement('div');
  tile.className = 'card-tile loading';
  tile.textContent = name;
  cardsEl.appendChild(tile);
  cardCache.set(key, { status: 'loading', tile });

  // throttle Scryfall calls (~100ms apart)
  scryfallQueue = scryfallQueue.then(() => new Promise(res => setTimeout(res, 100))).then(() => fetchCard(name, key));
}

async function fetchCard(name, key) {
  const entry = cardCache.get(key);
  try {
    const resp = await fetch('https://api.scryfall.com/cards/named?fuzzy=' + encodeURIComponent(name));
    if (!resp.ok) throw new Error('not found');
    const data = await resp.json();
    const img = (data.image_uris && data.image_uris.normal) ||
                (data.card_faces && data.card_faces[0].image_uris && data.card_faces[0].image_uris.normal);
    if (!img) throw new Error('no image');
    entry.canonical = data.name;
    entry.img = img;
    entry.scryfall = data.scryfall_uri;
    entry.identity = data.color_identity || [];
    entry.status = 'ok';
    entry.tile.className = 'card-tile';
    entry.tile.title = data.name;
    entry.tile.innerHTML = `<img loading="lazy" src="${img}" alt="${data.name}">`;
    // Click opens an in-app lightbox (NOT a navigation) so the chat is never lost.
    entry.tile.style.cursor = 'zoom-in';
    entry.tile.onclick = () => openLightbox(entry);
    // map canonical name too, so chips/hover using the exact name resolve correctly
    cardCache.set(keyFor(data.name), entry);
    evaluateTile(entry);  // flag if outside the commander's color identity
  } catch (e) {
    entry.status = 'missing';
    entry.tile.className = 'card-tile missing';
    entry.tile.textContent = name + ' (not found)';
  }
}

function flashCard(name) {
  const entry = cardCache.get(keyFor(name));
  if (!entry || !entry.tile) return;
  entry.tile.scrollIntoView({ behavior: 'smooth', block: 'center' });
  entry.tile.classList.add('flash');
  setTimeout(() => entry.tile.classList.remove('flash'), 1200);
}

// ---- send / stream ----
let streaming = false;

async function send() {
  const text = inputEl.value.trim();
  if (!text || streaming) return;
  inputEl.value = ''; inputEl.style.height = 'auto';
  addMessage('user', text);
  conversation.push({ role: 'user', text }); saveState();
  streaming = true; sendBtn.disabled = true;

  let bubble = null;
  let acc = '';
  const activity = addActivity();  // "Thinking…" appears immediately

  try {
    const resp = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session_id: SESSION_ID, message: text }),
    });
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const frames = buffer.split('\n\n');
      buffer = frames.pop();  // keep incomplete frame
      for (const frame of frames) {
        const ev = parseFrame(frame);
        if (!ev) continue;
        if (ev.event === 'text') {
          if (!bubble) { activity.stopSpinner(); bubble = addMessage('assistant', ''); }
          acc += ev.data.text;
          if (deckIdentity === null) {
            const m = acc.match(/%%IDENTITY:([WUBRGC]+)%%/i);
            if (m) setDeckIdentity(m[1].toUpperCase());
          }
          bubble.innerHTML = renderMarkdown(acc);
          bindChips(bubble);
          scrollToBottom();
        } else if (ev.event === 'status') {
          activity.addTool(ev.data.tool, ev.data.input || '');
        } else if (ev.event === 'identity') {
          // authoritative commander identity from the backend (tool args) -
          // drives off-color canvas flagging even if the model drops the marker
          if (ev.data.identity) setDeckIdentity(ev.data.identity.toUpperCase());
        } else if (ev.event === 'warning') {
          renderWarning(ev.data.cards);
        } else if (ev.event === 'error') {
          activity.stopSpinner();
          addMessage('assistant', '⚠️ ' + ev.data.message);
        }
      }
    }
  } catch (e) {
    addMessage('assistant', '⚠️ Connection error: ' + e.message);
  } finally {
    activity.finish();
    if (acc.trim()) { conversation.push({ role: 'assistant', text: acc }); saveState(); }
    streaming = false; sendBtn.disabled = false;
    inputEl.focus();
  }
}

function parseFrame(frame) {
  const lines = frame.split('\n');
  let event = 'message', data = '';
  for (const line of lines) {
    if (line.startsWith('event:')) event = line.slice(6).trim();
    else if (line.startsWith('data:')) data += line.slice(5).trim();
  }
  if (!data) return null;
  try { return { event, data: JSON.parse(data) }; }
  catch { return null; }
}

// Load chats + restore the active one on startup.
initChats();
</script>
