<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sign in · Brew Bot</title>
<style>
  :root {
    --bg: #14161a;
    --panel: #1c1f26;
    --panel-2: #232732;
    --border: #2e3340;
    --text: #e6e8ec;
    --muted: #9aa2b1;
    --accent: #c9963f;      /* MTG gold */
    --danger: #d9564f;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 15px/1.55 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    display: flex; align-items: center; justify-content: center; padding: 16px;
  }
  .card {
    width: 100%; max-width: 360px;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 14px; padding: 28px 26px 24px;
  }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
  h1 { font-size: 17px; margin: 0; font-weight: 650; letter-spacing: .2px; }
  .sub { color: var(--muted); font-size: 13px; margin: 0 0 22px 20px; }
  label { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: .6px;
          color: var(--muted); margin: 14px 0 6px; }
  input {
    width: 100%; padding: 10px 12px; font: inherit; color: var(--text);
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px; outline: none;
  }
  input:focus { border-color: var(--accent); }
  button {
    width: 100%; margin-top: 22px; padding: 11px; font: inherit; font-weight: 600;
    color: #1a1407; background: var(--accent); border: 0; border-radius: 8px; cursor: pointer;
  }
  button:hover { filter: brightness(1.08); }
  .alt { margin-top: 16px; text-align: center; font-size: 13px; color: var(--muted); }
  .alt a { color: var(--accent); text-decoration: none; }
  .alt a:hover { text-decoration: underline; }
  .err {
    display: none; margin-top: 16px; padding: 9px 12px; font-size: 13px;
    color: var(--danger); border: 1px solid var(--danger); border-radius: 8px;
    background: rgba(217, 86, 79, .08);
  }
</style>
</head>
<body>
  <form class="card" method="post" action="/login">
    <div class="brand"><span class="dot"></span><h1>Brew Bot</h1></div>
    <p class="sub">Sign in to continue</p>
    <label for="username">Username</label>
    <input id="username" name="username" autocomplete="username" autofocus required />
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required />
    <button type="submit">Sign in</button>
    <div class="err" id="err"></div>
    <div class="alt">New here? <a href="/signup">Create an account</a></div>
  </form>
<script>
  const e = new URLSearchParams(location.search).get('e');
  const msg = { bad: 'Wrong username or password.',
                locked: 'Too many failed attempts. Try again in 15 minutes.' }[e];
  if (msg) { const el = document.getElementById('err'); el.textContent = msg; el.style.display = 'block'; }
</script>
</body>
</html>
